<meta name="theme-color" content="#1a2123">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آخر الدنيا">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a2123;--panel:#232c2f;--line:#37444a;--tx:#ebe7da;--mut:#93a0a3;--hz:#d4a72c;--red:#c4513f;--grn:#7fae6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.9 Tajawal,system-ui,sans-serif;padding:14px 14px 90px;max-width:560px;margin-inline:auto}
h1,h2,h3{font-family:'Reem Kufi',Tajawal,sans-serif;margin:.3em 0}
h1{font-size:2.4rem;color:var(--hz);letter-spacing:0}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--hz) 0 14px,#1a2123 14px 28px);margin:6px 0 16px;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hz);outline-offset:2px}
.pri{background:var(--hz);color:#1a2123;border:0;font-weight:700;width:100%;padding:13px}
.ch{display:block;width:100%;text-align:right;margin:8px 0;padding:13px 14px;line-height:1.7}
.ch.sel{border-color:var(--hz);background:#2e3a3d}
input,select,textarea{background:#151b1d;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.9rem;text-align:center}
.res div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 2px}
.res b{display:block;font-size:1.1rem}
.low{border-color:var(--red)!important;color:#f0a090}
.pl{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pl>div{min-width:112px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.88rem;line-height:1.5}
.bar{height:5px;background:#101617;border-radius:3px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:3px}
.dead{opacity:.45}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.rl{padding:8px 2px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.rl span{font-size:1.5rem}
.rl.on{border-color:var(--hz);background:#2e3a3d;color:var(--hz)}
.pc div{padding:6px 10px;border-radius:8px;font-size:.92rem;line-height:1.6;margin-top:6px}
.pro{background:#22331f;border:1px solid #3d5c36}
.con{background:#3a2420;border:1px solid #6b3a31}
.scene{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--hz);border-radius:10px;padding:14px 16px;margin:10px 0 14px}
.lt{color:var(--hz);font-family:'Reem Kufi',sans-serif;margin-inline-end:8px}
.ch:active{transform:scale(.99)}
.acts{gap:6px}
.acts button{flex:1 1 44%;padding:10px 6px;font-size:.9rem}
.story{white-space:pre-wrap;font-size:1.08rem;line-height:2.05}
.mut{color:var(--mut);font-size:.9rem}
.err{color:#f0a090}
.bottom{position:fixed;inset:auto 0 0 0;background:#141a1c;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;max-width:560px;margin:auto}
.bottom button{flex:1;padding:9px 4px;font-size:.92rem}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;border:1px solid var(--line)}
.tm{height:6px;background:var(--red);border-radius:3px;transition:width 1s linear}
.sk{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.sk button{padding:2px 12px;flex:0}
.novel{font-size:1.1rem;line-height:2.2;white-space:pre-wrap}

.i{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
body{max-width:480px;padding-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;font:600 1rem 'Reem Kufi',sans-serif;color:var(--hz);padding:4px 2px 10px}
.top .mut{font:400 .8rem Tajawal}
.res div{background:linear-gradient(180deg,#2a3539,#232c2f);border-radius:10px;padding:5px 2px}
.res .i{width:1.3em;height:1.3em;color:var(--hz)}
.res .low .i{color:var(--red)}
.pro .i{color:var(--grn)}.con .i{color:#e08a78}
.ch{border-radius:12px;background:linear-gradient(180deg,#283236,#232c2f)}
.lt{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border:1px solid var(--hz);border-radius:50%;font-size:.85rem;line-height:1}
.bottom{max-width:480px;gap:4px;border-radius:18px 18px 0 0}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;line-height:1.3;padding:8px 2px;border:0;background:transparent;color:var(--mut)}
.bottom button .i{width:1.7em;height:1.7em;color:var(--hz)}
.hero{text-align:center;padding:26px 0 6px}
.emb{width:84px;height:84px;margin:0 auto 6px;display:grid;place-items:center;border-radius:24px;background:var(--hz);color:#1a2123;box-shadow:0 0 0 6px #d4a72c22}
.emb .i{width:48px;height:48px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.mi{display:flex;align-items:center;gap:12px;text-align:right;padding:14px;border-radius:14px;background:linear-gradient(180deg,#283236,#232c2f)}
.mi>.i:first-child{width:1.9em;height:1.9em;color:var(--hz)}
.mi span{flex:1;display:flex;flex-direction:column;line-height:1.4}
.mi small{color:var(--mut);font-size:.8rem}
.mi>.i:last-child{color:var(--mut)}
.mi.main{background:var(--hz);color:#1a2123;border:0}
.mi.main small,.mi.main .i{color:#1a2123!important}
.stamp{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--red);color:var(--red);padding:1px 10px;border-radius:4px;font:700 .8rem 'Reem Kufi';transform:rotate(-2deg)}
.mi-sec{display:flex;gap:8px;align-items:center;margin:18px 0 6px;color:var(--hz);font:600 .95rem 'Reem Kufi'}
.mi-sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.dos{position:relative;background:linear-gradient(180deg,#273135,#1f282b);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;margin:14px 0;overflow:hidden}
.dos:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:repeating-linear-gradient(-45deg,var(--hz) 0 10px,#1a2123 10px 20px)}
.dh{display:flex;align-items:center;gap:8px;margin:6px 0 8px;color:var(--hz);font:600 .95rem 'Reem Kufi'}
.dh .rk{margin-inline-start:auto;background:var(--hz);color:#1a2123;padding:1px 10px;border-radius:4px;font-size:.85rem}
.fl{display:block;font-size:.78rem;color:var(--mut);margin:8px 0 4px}
.rl{background:#161d1f;border-radius:10px;padding:10px 2px;gap:4px}
.rl .i{width:1.7em;height:1.7em}
.rl.on{border-color:var(--hz);background:#2b3326;box-shadow:0 0 0 1px var(--hz) inset,0 0 14px #d4a72c33}

const SYS=`إنت حكّاء روائي بارع، بتحكي للاعبين قصة بقاء في نهاية العالم كأنها فصل من رواية مانهوا مشوّقة. اكتب بالعربية الفصحى السليمة بأسلوب أدبي حيّ، بضمير الغائب، مع حوارات حقيقية ومشاعر وحواس وتفاصيل. ممنوع تماماً ذكر أرقام المهارات أو الصحة أو السمات أو عبارات مثل «بفضل شجاعته» أو «بقوته الكبيرة»؛ أظهر الشخصية من خلال تصرفاتها وأفكارها وكلامها كما يفعل الروائي، ولا تشرح قواعد اللعبة. الاختيارات تُكتب بالفصحى كذلك.
كل رد لازم يكون بالشكل ده بالظبط:
1) مشهد من 180 إلى 250 كلمة، مشحون بالتوتر والدراما، يستخدم أسماء اللاعبين، وينتهي بلحظة معلّقة تفرض قراراً.

3) JSON واحد بدون أي كلام تاني:
{"choices":["اختيار","اختيار","اختيار"],"fx":{"food":0,"water":0,"meds":0,"fuel":0,"ammo":0,"morale":0,"trust":0,"def":0},"kills":0,"hurt":{"0":0},"ally":null,"allyFx":[],"betray":null,"gone":[],"choicesOut":[],"choicesIn":[],"beat":"سطر واحد بيلخص اللي حصل","seed":null,"done":[],"by":null,"min":0,"ptrust":[],"sep":null,"meet":null,"loc":"","places":[],"infect":null,"cast":[],"system":"","timer":false,"boss":false,"split":false,"power":null,"status":[],"cure":[],"end":null}
القواعد: من 3 إلى 4 اختيارات مختلفة جداً (مكان، مخاطرة، رحمة، تضحية). fx تغييرات صغيرة (من -3 إلى +3) مرتبطة بنتيجة اختيار الفريق السابق. hurt = أضرار على اللاعبين بالرقم (index) من 0 إلى 25. kills = عدد المصابين/الوحوش اللي الفريق قتلهم في المشهد. ally = اسم ناجي جديد انضم أو null. seed = عاقبة مؤجلة تحصل بعد 3 مشاهد أو أكتر (مثلا "الناجي اللي سبناه هيرجع") أو null. استخدم الـseeds القديمة وارجع لها. timer=true في لحظة خطر حرجة. boss=true لو وحش ضخم. power = قوة خارقة عشوائية بثمن لواحد من اللاعبين {"p":index,"text":".."} أو null. الدرجات: النرد من 1 إلى 20 بيحدد نجاح الاختيار السابق (أقل من 8 فشل، أكتر من 14 نجاح كبير) ومهارات اللاعبين بتحسنه. اجعل ميزة كل دور وعيبه وسمته تظهر في تصرفات الشخصية دون ذكرها صراحة. الاختيار الذي يناسب مهارة أحدهم ينجح أكثر، ويجوز التلميح إليه بين قوسين بكلمتين (مثل: يناسب سعيد). الخيار الذي يناسب المهارة ينجح أكثر. القوة الخارقة (power) يجب أن يذكر نصها الميزة والثمن معاً. إذا كان وضع اللعب «لاعب منفرد» فخاطب البطل وحده، ولا تذكر فريقاً ولا تصويتاً ولا خلافاً بين اللاعبين. مكان البداية دائماً عادي ومألوف (منزل أو حديقة أو شارع)، أما الأماكن الغريبة كالسفينة والسجن والمستشفى فتأتي لاحقاً في منتصف الرحلة لا في بدايتها. وجّه القصة نحو «هدف الرحلة» المذكور، وأنهِها به أو بما يقاربه. الحالات (status): لكل حالة عنصر {"p":رقم اللاعب,"name":"اسم قصير","type":"buff أو debuff أو injury","sk":{"قوة":1},"scenes":عدد المشاهد من 2 إلى 5 أو 0 للدائمة,"text":"وصف الأثر في جملة"}، ومفاتيح sk من: قوة، سرعة، تحمل، تخفي، علاج، صيد. في المشهد الأول امنح لاعباً أو اثنين حالة (قوة أو ضعف) تناسب بداية الكارثة. في منتصف الرحلة (المشاهد 6 إلى 10) قد يكتسب لاعب قوة أو حالة قوية. في المشاهد الأخيرة قد تُمنح دفعة أخيرة أو يظهر ضعف يعقّد النهاية. الإصابة (injury) تنتج عن الأضرار الكبيرة والاختيارات الخطرة وتضعف مهارة لاعب عدة مشاهد، وإذا عولجت فاستخدم cure:[{"p":رقم,"name":"اسم الحالة"}]. لا تزد عن حالتين جديدتين في المشهد، وراعِ الحالات الحالية للاعبين في السرد والنتائج. def هو تحصين الملجأ (من 0 إلى 10): يزيد بالتحصين والإصلاح وينقص بالهجمات. عندما يكون الفريق في الملجأ قد تقع أحداث داخله: هجوم أو تسلل أو مرض أو نزاع أو سرقة أو زائر غريب، وكلما قل التحصين زادت الخطورة. وإذا كانت الموارد قليلة (طعام أو ماء 2 فأقل) فاجعل الجو ضاغطاً ويلمّح إلى الحاجة للخروج. الانقسام: إذا ذُكر في الحالة أن مجموعة في الخارج ومجموعة في الملجأ فاسرد ما يحدث للمجموعتين معاً (ابدأ الجزء الأول بـ «في الخارج:» والثاني بـ «في الملجأ:»)، وقد يصيب الأذى أياً منهما، وما تجلبه البعثة يظهر في fx، ومهارات الخارجين تؤثر في نجاحها. ضع split:true إذا بقيت المجموعتان منفصلتين لمشهد آخر، وإلا ضع false لتعود المجموعتان معاً. قرارات الفريق قد تكون إجراءً مثل التحصين أو الراحة أو الاستطلاع فاجعل لها أثراً واقعياً. الناجون: قد يقابل الفريق ناجين؛ إذا أُنقذوا فأضفهم مرة واحدة في ally كائناً {"name":"","skill":"مهارة تفيد الفريق"}. للحلفاء ثقة من 0 إلى 10 تراها في الحالة: غيّرها بـ allyFx:[{"name":"","trust":1}] حسب معاملة الفريق لهم (مشاركة الطعام والحماية والصدق ترفعها، والتخلي والكذب والتضحية بهم تخفضها). الحليف ذو الثقة 2 فأقل قد يخون في أي وقت (سرقة المؤن، كشف الموقع، الهروب) فاستعمل betray:"اسمه" مع الأثر في fx وhurt، والثقة 8 فأكثر تجعله وفياً يضحي ويساعد. استعمل gone:["اسم"] لمن يموت أو يغادر، وأشرك الحلفاء بمهاراتهم في المشاهد. عند الانقسام (split:true) أرجع choicesOut لمن في الخارج وchoicesIn لمن في الملجأ (من 3 إلى 4 اختيارات لكل مجموعة، مختلفة وتناسب موقف كل منهما) واترك choices فارغة؛ الحدثان يجريان في الوقت نفسه ويؤثر قرار كل مجموعة في الأخرى وفي المستقبل. في المشهد التالي يصلك قرارا المجموعتين معاً فاسرد النتيجتين المتزامنتين وأثر كل قرار في الآخر، وأعد الجميع للاجتماع (split:false) خلال مشهدين أو ثلاثة. الدراما: لا يمر أكثر من ثلاثة مشاهد دون حدث غير متوقع (انقلاب، خيانة، كشف سر، ظهور مفاجئ، موت صادم، مطاردة). اجعل الأبطال ينجون من الموت بالكاد ثم يدفعون الثمن. الأعداء وحوش وبشر معاً: عصابات ومؤامرات وقادة مخادعون. الشخصيات: لكل بطل رابط عاطفي (صديق أو قريب أو حبيب يريد إنقاذه) مسجّل في «الشخصيات»؛ حرّك خيطه كل بضعة مشاهد بنتائج مفرحة أو موجعة. وأدخل شخصيات ثانوية مؤثرة: حبيب أو حبيبة يقع في حب أحد الأبطال أو يقع هو في حبه، عدو شخصي يكرهه ويتربص به ويحاول قتله، خائن، غامض. سجّلها وعدّلها في cast:[{"name":"","role":"رابط|حب|عدو|صديق|خائن|مجهول","note":"حالتها في جملة"}] وأضف gone:true لمن يخرج من القصة، وتابعها في المشاهد التالية بدل نسيانها. الاختيارات: كل اختيار فكرة وحبكة مختلفة، لا تكشف عاقبته، وفيها جرأة أو أخلاق أو تضحية أو مقامرة. كل اختيار مهم يزرع عاقبة في seed تُحصد بعد 2 إلى 6 مشاهد، لا بالضرورة في المشهد التالي؛ العواقب القديمة تصلك مرقّمة فاحصدها وضع أرقام المحصودة في done. العدوى: إذا كانت الكارثة فيها عدوى (زومبي أو فيروس) وعضّ مصاب أو خدش لاعباً فضع infect:{"p":رقم,"part":"الساعد أو الكف أو الساق أو القدم أو الكتف أو الرقبة أو الرأس أو الصدر أو البطن"}؛ الأطراف يمكن بترها لينجو، أما الرأس والرقبة والصدر والبطن فتعني التحول وفقدانه. اجعل لحظة العضّ مأساوية، وإذا وصلتك حالة «أحداث فورية» (كبتر طرف) فاسردها بتأثير. system: جملة قصيرة (حتى 20 كلمة) بصوت «النظام» الغامض الذي يرافق الناجين كنافذة ألعاب في المانهوا، يعلّق عند القتل والخطر الكبير والأحداث الكبرى ويشجع أو يحذّر أو يعلن مهمة؛ اتركها فارغة إن لم تلزم. by: رقم اللاعب الذي قتل الأعداء في المشهد أو null. إذا ذُكر «عالم قصة خاص» فالتزم بعالمه وقواعده وقواه وشخصياته كما هي وواصل أحداثه وفق اختيارات اللاعبين. الخطة الحرة: إذا كان اختيار الفريق «خطة كتبها اللاعبون بأنفسهم» فجرّبها بواقعية داخل القصة: صف خطواتها ونتيجتها الفعلية وما انقلب فيها وما لم يخطر ببالهم؛ للنرد والمهارات والمكان والموارد دور، والنجاح الكامل نادر، والخطة الذكية تُكافأ والساذجة تُعاقب بعاقبة مثيرة. القدرات: إذا استخدم لاعب «قدرته» فاسرد أثرها القتالي بوضوح. الهجوم على المصابين لتنظيف الطريق: اسرد معركة حقيقية بخسائر ومكاسب (kills وhurt وby). الجوع والعطش: تصلك قيمة جوع وعطش (من 100) لكل لاعب وهي تنقص تلقائياً، فلمّح إلى الجوع والعطش في السرد عند انخفاضهما ولا تعدّل الأرقام. «مأوى لعدة أيام»: مرّر أياماً واسرد الحياة في المأوى والجائحة خارجه بأحداث متصاعدة (جيران، هجمات، مرض، تسلل) وأثرها في الموارد والتحصين. الوقت: يصلك الوقت الحالي (اليوم والساعة). ضع في min عدد الدقائق التي مرّت في هذا المشهد (من 10 إلى 240 عادة، وأكثر من 1440 عند البقاء أياماً في مأوى)، وليكن السرد منسجماً مع الوقت: الضوء والظلام والبرد والحر وصمت الشوارع أو ضجيجها، وأخطار الليل أشد، ولا تذكر «المشهد» بل الساعة والزمن. الثقة بين اللاعبين: عدّلها في ptrust:[{"a":رقم,"b":رقم,"d":من -3 إلى 3}] حسب مواقفهم (كذب، تضحية، إنقاذ، أنانية، سر مكشوف)، وأظهر الثقة المنخفضة في الحوار والشك. الانفصال: إذا وصلك أن لاعباً «قرر سراً أن يترك الفريق» فارسم انفصاله بصدق وأرجع sep:{"who":[رقمه],"text":"مشهد المنفصل وحده من 150 إلى 220 كلمة","choices":[3 إلى 4 اختيارات]} مع مشهد المجموعة الباقية في النص الأساسي واختياراتها في choices. بعد الانفصال يصلك المسار النشط في الحالة: اسرد مشهد هذا المسار وحده، ولا تكشف لأي مسار ما يعرفه الآخر؛ لكل مسار أحداثه وأعداؤه ومفاجآته، وقرارات كل مسار تؤثر في الآخر بالأثر والزمن والمصادفة. الانفصال دائم ولا يعود الفريق واحداً أبداً: لكل مسار مشاهده وخاتمته، والزمن يمضي فيهما معاً. قد يلتقي المساران مصادفة أو بسبب قرارات كل منهما (حلفاء أو أعداء)، فأرجع meet:"ally" أو meet:"enemy" في المشهد الذي يلتقون فيه ثم يفترقون من جديد. لا تضع end إلا حين ينتهي مصير هذا المسار نفسه (نجاة أو موت أو نهاية)، وسيستمر الآخر. وكل اختيار يبدأ بـ«نرجع إلى» يعني عودة فعلية إلى ذلك المكان. الأماكن: سجّل المكان الحالي في loc وكل مكان مهم في places:[{"name":"","note":"حالته الآن"}] (نظّفتموه، فيه أكل، خطير، مأوى محصّن). وإذا طلب الفريق العودة إلى مكان سابق فأعدهم إليه فعلاً، وقدّر زمن الطريق في min، واسرد ما تغيّر في غيابهم (دخله أحد، نفد طعامه، انكسر تحصينه) وقد تفاجئهم. غير الأماكن والأحداث والجوائح، ومتكررش. المشهد رقم 16 فما فوق: ابدأ تمهد لنهاية، وحط end="win" أو "lose" أو "twist" لما القصة توصل نهاية طبيعية (النجاة، ملجأ، كشف سبب الجائحة، أو نهاية مأساوية). مفيش end قبل المشهد 10 إلا لو الكل مات.`;

function icoify(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;
  while(n=w.nextNode())if(RT.test(n.data)&&!/^(TEXTAREA|SCRIPT|STYLE)$/.test(n.parentNode.nodeName))L.push(n);

async function stream(system,user,max,onText){
  const c=cfg(),g=c.prov==='gemini';
  const url=g?`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:streamGenerateContent?alt=sse`:'https://api.anthropic.com/v1/messages';
  const headers=g?{'content-type':'application/json','x-goog-api-key':c.key}:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  const body=g?{systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:max+4000,temperature:1}}
             :{model:c.model,max_tokens:max,stream:true,system,messages:[{role:'user',content:user}]};
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  if(!r.ok){let t='';try{const e=await r.json();t=e.error.message}catch(e){}
    throw new Error(r.status===429?'خلصت الحصة المجانية دلوقتي، جرّبوا بعد شوية أو بكرة. ':(r.status+' '+t))}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='',full='';
  for(;;){const{done,value}=await rd.read();if(done)break;
    buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:'))continue;
      try{const j=JSON.parse(l.slice(5));let t='';
        if(g){t=((j.candidates||[])[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('')}
        else if(j.type==='content_block_delta'&&j.delta.text)t=j.delta.text;
        if(t){full+=t;onText(full)}}catch(e){}}}
  return full;
}

function apply(j){

  if(kl){const by=S.players[+j.by];let t;if(by&&by.hp>0&&j.by!=null){by.pts+=kl;t=by.name+': +'+kl+' نقاط تطوير'}else{S.players.forEach(q=>{if(q.hp>0)q.pts++});t='+1 نقطة تطوير لكل ناجٍ'}S.sysq.push('تم القضاء على '+kl+' من الأعداء.',t)}
  if(j.beat)S.beats.push(j.beat);const dn=(j.done||[]).map(x=>+x-1);if(dn.length)S.seeds=S.seeds.filter((x,i)=>!dn.includes(i));if(j.seed)S.seeds.push(j.seed);
  if(j.power&&S.players[j.power.p]&&!S.players[j.power.p].power)S.players[j.power.p].power=j.power.text;
  while(S.kills>=S.level*5){S.level++;S.players.forEach(p=>p.pts+=3);S.lvlUp=true;S.sysq.push('ارتفع مستوى الفريق إلى '+S.level+'. +3 نقاط تطوير لكل لاعب.')}
  applyFx(j);applyInfect(j);applyCast(j);applyWorld(j);
}
const INJ=[{name:'جرح في الساق',sk:{سرعة:-1},text:'يعرج ويتباطأ.'},{name:'ذراع مصابة',sk:{قوة:-1},text:'تضعف قبضته.'},{name:'إرهاق شديد',sk:{تحمل:-1},text:'يتعب سريعاً.'},{name:'ارتجاج خفيف',sk:{تخفي:-1,صيد:-1},text:'يفقد تركيزه.'}];

  if(DP.o==null||DP.i==null)return;
  if(S.split.out.length<2&&S.split.inside.length<2){sendDual();return}
  $('cf').innerHTML=`<div class="box"><b>قرار المجموعتين</b><br>هل اتفق أفراد كل مجموعة على قرارها؟<div class="row" style="margin-top:8px"><button class="pri" onclick="sendDual()">اتفقنا ✓</button><button onclick="$('cf').innerHTML=''">لسه بنتناقش</button></div></div>`}
function timeUp(){const sc=S.scene,r=n=>Math.floor(Math.random()*n);
  if(sc.dual&&S.split){if(DP.o==null)DP.o=r(sc.dual.out.length);if(DP.i==null)DP.i=r(sc.dual.inn.length);sendDual()}
  else confirmPick(r(sc.choices.length))}
function heal(i){const p=S.players[i];if(!p||p.hp<=0)return;
  if(S.scene&&S.scene.timer&&!S.over){alert('لا وقت للعلاج في لحظة الخطر!');return}
  if(S.res.meds<1)return;
  S.res.meds--;const k=(p.fx||[]).findIndex(f=>f.type==='injury');if(k>=0)p.fx.splice(k,1);
  p.hp=Math.min(100,p.hp+15);S.news=['💊 عولج '+p.name];save();closeM();game()}

let picked=null;
function game(){
  clearInterval(tmr);picked=null;DP={o:null,i:null};
  if(S.hand){S.hand=false;handoff();return}
  if(!S.scene){S&&S.prologue?intro():home();return}
  if(S.res.def==null)S.res.def=3;if(S.t==null)S.t=480;
  S.allies=(S.allies||[]).map(a=>typeof a==='string'?{name:a,skill:'',trust:5}:a);
  const sc=S.scene,pts=S.players.reduce((a,p)=>a+p.pts,0);
  const lv=S.lvlUp?`<div class="box" style="border-color:var(--hz)">⭐ الفريق وصل المستوى ${S.level}! كل لاعب أخد 3 نقاط تطوير.</div>`:'';S.lvlUp=false;
  $('app').innerHTML=`
  <div class="top"><span>${ic('shield')} آخر الدنيا</span><span class="mut">${tm(S.t)} · مستوى ${S.level}</span></div>
  <div class="res">${Object.keys(RES).map(k=>`<div class="${S.res[k]<=1?'low':''}">${RES[k].split(' ')[0]}<b>${S.res[k]}</b><span class="mut">${RES[k].split(' ')[1]}</span></div>`).join('')}<div>⚔️<b>${S.kills}</b><span class="mut">قتلى</span></div></div>
  ${defLine()}<div class="pl" style="margin-top:8px">${S.players.map((p,i)=>`<div class="${p.hp<=0?'dead':''}" onclick="upg(${i})"><b>${ROLES[p.role].e} ${esc(p.name)}</b>${p.pts>0&&p.hp>0?'<span class="pb">+'+p.pts+'</span>':''}${S.sep&&S.sep.who.includes(i)?'<span class="mut"> · منفصل</span>':''}${(p.hun??80)<25?' 🍞':''}${(p.thr??80)<25?' 💧':''}<br><span class="mut">${p.role}</span> ${(p.fx||[]).map(f=>FXI[f.type]||'').join('')}<div class="bar"><i style="width:${p.hp}%;background:${p.hp>60?'var(--grn)':p.hp>30?'var(--hz)':'var(--red)'}"></i></div>${p.hp<=0?(p.turned?'تحوّل':'مات'):(p.inf?'☣ عدوى':'')}${p.power?'<br>✨ '+esc(p.power):''}</div>`).join('')}</div>
  <div class="tape" style="margin-top:12px"></div>
  ${lv}${splitBox()}${newsBox()}${infBox()}${sepBox()}${sc.boss?'<div class="mut" style="color:var(--red)">⚠️ زعيم المرحلة</div>':''}
  <div class="scene"><div class="mut">${tm(S.t)}</div><div class="story">${esc(sc.text)}</div></div>
  ${S.over?endBox():`${sc.timer?'<div class="mut">قرروا بسرعة!</div><div class="tm" id="tm" style="width:100%"></div>':''}
  <div id="chs">${sc.dual&&S.split?dualHtml(sc):sc.choices.map((c,i)=>`<button class="ch" onclick="pick(${i})"><b class="lt">${'أبجد'[i]}</b>${esc(c)}</button>`).join('')}</div><div id="cf"></div>${S.split?'':acts()}`}
  <button class="bagbtn" onclick="bag()">${ic('pack')}</button><div class="bottom"><button onclick="upg()">🔧 تطوير${pts?' ('+pts+')':''}</button><button onclick="team()">👥 الفريق</button>${S.players.length>1&&!S.sep&&S.players.filter(q=>q.hp>0).length>1?'<button onclick="privAsk()">🔒 سرّي</button>':''}<button onclick="code()">💾 كود</button><button onclick="finish()">📖 نهاية</button></div>`;sysPop();
  if(sc.timer&&!S.over){let t=12;tmr=setInterval(()=>{t--;const b=$('tm');if(b)b.style.width=(t/12*100)+'%';if(t<=0){clearInterval(tmr);timeUp()}},1000)}
}
function endBox(){return `<div class="box" style="border-color:var(--hz)"><b>${{win:'نجوتوا! 🎉',lose:'الرحلة انتهت بمأساة 💀',twist:'نهاية مفاجئة...'}[S.over]||'النهاية'}</b><p class="mut">دلوقتي الراوي هيكتب رحلتكم كلها كرواية قصيرة.</p><button class="pri" onclick="novel()">اكتب الرواية</button></div>`}
function pick(i){
  if(S.players.length==1||soloT()){confirmPick(i);return}
  picked=i;document.querySelectorAll('.ch').forEach((b,k)=>b.classList.toggle('sel',k==i));
  $('cf').innerHTML=`<div class="box"><b>كل اللاعبين موافقين على الاختيار ده؟</b><div class="row" style="margin-top:8px"><button class="pri" onclick="confirmPick(${i})">كلنا موافقين ✓</button><button onclick="$('cf').innerHTML='';document.querySelectorAll('.ch').forEach(b=>b.classList.remove('sel'))">لسه بنتناقش</button></div></div>`;
}
function confirmPick(i){clearInterval(tmr);next(S.scene.choices[i])}

function team(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>${S.players.length>1?'الفريق':'بطلك'}</h2>
  ${S.players.map((p,i)=>{const R=ROLES[p.role],T=TRAITS[p.trait]||{pro:'',con:''},E=effSk(p);
  const hurt=(p.fx||[]).some(f=>f.type==='injury')||p.hp<100;
  return `<div class="box"><h3>${R.e} ${esc(p.name)} <span class="mut">${p.role} · ${p.trait} · صحة ${p.hp}</span></h3>
  <div class="mut">${SK.map(k=>k+' '+E[k]+(E[k]!==p.sk[k]?(E[k]>p.sk[k]?' ⬆️':' ⬇️'):'')).join(' · ')}</div>
  <div class="pc"><div class="pro">✅ ${R.pro}</div><div class="con">⚠️ ${R.con}</div><div class="pro">✅ سمة ${p.trait}: ${T.pro}</div><div class="con">⚠️ ${T.con}</div>${p.power?'<div class="pro">✨ '+esc(p.power)+'</div>':''}${fxHtml(p,true)}</div>
  ${p.hp>0&&hurt?`<button style="margin-top:8px" ${S.res.meds<1?'disabled':''} onclick="heal(${i})">💊 عالج (يستهلك دواء، المتبقي ${S.res.meds})</button>`:''}
  <button style="margin-top:8px" onclick="goal(${i})">${S.players.length>1?'هدفي السري (صاحبه فقط يرى)':'هدفك السري'}</button><div id="g${i}" class="mut"></div></div>`}).join('')}
  ${S.allies.length?`<div class="box"><h3>🤝 الحلفاء</h3>${S.allies.map(a=>`<div style="margin:10px 0"><b>${esc(a.name)}</b> <span class="mut">${esc(a.skill||'')}</span><div class="bar"><i style="width:${a.trust*10}%;background:${a.trust<=2?'var(--red)':a.trust<=4?'var(--hz)':'var(--grn)'}"></i></div><span class="mut">ثقة ${a.trust}/10 · ${a.trust<=2?'⚠️ قد يخونكم في أي لحظة':a.trust<=4?'متردد':a.trust>=8?'وفيّ لكم':'يثق بكم'}</span></div>`).join('')}</div>`:''}
  ${trustBox()}${placesBox()}${castBox()}<p class="mut">المستوى ${S.level}، قتلى ${S.kills}. المستوى التالي عند ${S.level*5} قتيل.</p></div></div>`;
}
function goal(i){const e=$('g'+i);e.textContent=e.textContent?'':S.players[i].goal}
const ABIL={'مقاتل':[{n:'ضربة قاضية',lv:1,t:'ضربة قوية تقضي على عدو أو تُسقط وحشاً'},{n:'درع بشري',lv:3,t:'يتقدم ويتلقى الضرر عن رفاقه'}],
'طبيب':[{n:'إسعاف سريع',lv:1,t:'يضمّد رفيقاً أثناء المعركة'},{n:'مصل طارئ',lv:3,t:'يحاول إبطاء العدوى عند مصاب'}],
'مستكشف':[{n:'كمين صامت',lv:1,t:'يهاجم من الخلف دون أن يُرى'},{n:'طريق سري',lv:3,t:'يفتح مساراً آمناً بين البيوت'}],
'مهندس':[{n:'فخ مرتجل',lv:1,t:'ينصب فخاً يوقف مجموعة مصابين'},{n:'تفجير موجّه',lv:3,t:'يستخدم وقوداً وذخيرة لتفجير حاسم'}],
'صياد':[{n:'رمية قناص',lv:1,t:'يصيب هدفاً بعيداً بدقة'},{n:'تتبّع',lv:3,t:'يقتفي الأثر ويكشف الكمائن والموارد'}],
'متوازن':[{n:'إصرار',lv:1,t:'يرفض الاستسلام ويقاتل حتى النهاية'},{n:'خطة بديلة',lv:3,t:'يرتجل مخرجاً من موقف مستحيل'}]};
let UPO=null;
function abil(i,k){const p=S.players[i],a=ABIL[p.role][k];if(S.level<a.lv||p.hp<=0||(p.cdn&&p.cdn[a.n]>S.t))return;closeM();
  pickCustom(`استخدم ${p.name} قدرته «${a.n}» (${a.t}) في هذا الموقف`,null,()=>{p.cdn=p.cdn||{};p.cdn[a.n]=S.t+180})}
function upg(only){UPO=only==null?null:only;
  const tot=S.players.reduce((a,p)=>a+(p.hp>0?p.pts:0),0);
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="sysp" style="max-width:520px">
  <div class="sysh">[ نافذة الحالة ]</div><div class="sysl" style="text-align:center">النقاط المتاحة: <b style="color:#7fd6ff;font-size:1.2rem">${tot}</b></div>
  ${S.players.map((p,i)=>only!=null&&only!==i?'':`<div class="sysc"><div class="row" style="justify-content:space-between"><b>${esc(p.name)}</b><span style="color:#7fa9c9;font-size:.85rem">${p.role} · مستوى ${S.level} · نقاط ${p.pts}</span></div>
  <div class="bar" style="margin:6px 0"><i style="width:${p.hp}%;background:${p.hp>60?'var(--grn)':p.hp>30?'var(--hz)':'var(--red)'}"></i></div>
  <div style="color:#7fa9c9;font-size:.82rem;margin-bottom:4px">صحة ${p.hp} · جوع ${p.hun??80} · عطش ${p.thr??80}</div>
  ${SK.map(k=>`<div class="sk2"><span>${k}</span><div class="sb"><i style="width:${Math.min(100,p.sk[k]*10)}%"></i></div><b>${p.sk[k]}</b><button class="sysb" ${p.pts&&p.hp>0?'':'disabled'} onclick="up(${i},'${k}')">+</button></div>`).join('')}
  ${fxHtml(p,false)}${p.power?'<div class="pro">✨ '+esc(p.power)+'</div>':''}
  <div style="color:#7fa9c9;margin-top:8px">القدرات</div>${ABIL[p.role].map((a,k)=>{const cd=(p.cdn&&p.cdn[a.n]>S.t)?p.cdn[a.n]-S.t:0,lock=S.level<a.lv;return `<div class="sk2"><span style="width:auto;flex:1">${a.n}<br><small style="color:#7fa9c9">${lock?'تُفتح عند المستوى '+a.lv:cd?'جاهزة بعد '+hrs(cd):a.t}</small></span><button class="sysb" ${lock||cd||p.hp<=0?'disabled':''} onclick="abil(${i},${k})">استخدم</button></div>`}).join('')}</div>`).join('')}</div></div>`;
}
const closeB=()=>{closeM();game()};
function bag(){
  if(S.scene&&S.scene.timer&&!S.over){alert('لا وقت للحقيبة في لحظة الخطر!');return}
  S.open=S.open||[];const R=S.res,po=S.open.reduce((a,x)=>a+x.p,0);
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeB()"><div class="sysp" style="max-width:520px"><div class="sysh">[ الحقيبة ]</div>
  <div class="bagg">${['food','water','meds','fuel','ammo'].map(k=>`<div class="bg">${RES[k].split(' ')[0]}<b>${R[k]}</b><small>${RES[k].split(' ')[1]}</small></div>`).join('')}</div>
  <div class="sysl">${po?`حصص طعام مفتوحة: <b>${po}</b> · أقدمها تفسد بعد ${hrs(S.open[0].exp-S.t)}`:'لا توجد حصص مفتوحة'}</div>
  <button class="sysb" style="width:100%" ${R.food<1?'disabled':''} onclick="openCan()">افتح علبة طعام وقسّمها إلى 3 حصص</button>
  ${S.players.map((p,i)=>p.hp<=0?'':`<div class="sysc"><b>${esc(p.name)}</b>
  <div class="sk2"><span>جوع</span><div class="sb"><i style="width:${p.hun??80}%"></i></div><b>${p.hun??80}</b><button class="sysb" ${po?'':'disabled'} onclick="eat(${i})">كُل</button></div>
  <div class="sk2"><span>عطش</span><div class="sb"><i style="width:${p.thr??80}%"></i></div><b>${p.thr??80}</b><button class="sysb" ${R.water<1?'disabled':''} onclick="drink(${i})">اشرب</button></div></div>`).join('')}
  <div style="color:#7fa9c9;font-size:.82rem">الجوع والعطش ينقصان كل مشهد، وعند الصفر تفقد صحتك. الحصة المفتوحة تفسد بعد 8 ساعات.</div>
  <button class="sysb" style="width:100%;margin-top:8px" onclick="closeB()">إغلاق</button></div></div>`}
function openCan(){if(S.res.food<1)return;S.res.food--;S.open=(S.open||[]).concat([{p:3,exp:S.t+480}]);save();bag()}
function eat(i){if(!S.open||!S.open.length)return;S.open[0].p--;if(S.open[0].p<=0)S.open.shift();const p=S.players[i];p.hun=Math.min(100,(p.hun??80)+30);save();bag()}
function drink(i){if(S.res.water<1)return;S.res.water--;const p=S.players[i];p.thr=Math.min(100,(p.thr??80)+45);save();bag()}
function planBox(){return `<div class="box plan"><div style="color:#7fd6ff">${ic('spark')} خيارك الخاص</div><textarea id="plan" rows="2" placeholder="اكتبوا خطتكم... مثلاً: نشعل النار في المخزن لنجذب المصابين، أو: نرجع للبيت اللي حصّنّاه"></textarea><button class="sysb" style="width:100%;margin-top:6px" onclick="planGo()">جرّبوا الخطة</button></div>`}
function planGo(){const t=($('plan').value||'').trim();if(t.length<4)return;pickCustom('خطة كتبها اللاعبون بأنفسهم وعليك تجربتها بواقعية: '+t)}
function up(i,k){const p=S.players[i];if(p.pts>0){p.pts--;p.sk[k]++;save();upg(UPO);if(S.players.every(x=>!x.pts)){closeM();game()}}}

function code(){
  const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>كود الحفظ</h2><p class="mut">الرحلة بتتحفظ تلقائي. انسخوا الكود ده لو عايزين تكملوا من جهاز تاني.</p><textarea id="cd" rows="5" dir="ltr" readonly>${c}</textarea><div class="row" style="margin-top:8px"><button class="pri" onclick="$('cd').select();navigator.clipboard&&navigator.clipboard.writeText($('cd').value);this.textContent='اتنسخ ✓'">نسخ</button><button onclick="closeM();home()">خروج للرئيسية</button></div></div></div>`;
}
function loadCode(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>تحميل رحلة</h2><textarea id="cd" rows="5" dir="ltr" placeholder="الصقوا الكود هنا"></textarea><div style="height:8px"></div><button class="pri" onclick="try{S=JSON.parse(decodeURIComponent(escape(atob($('cd').value.trim()))));save();closeM();game()}catch(e){this.textContent='الكود غلط'}">تحميل</button></div></div>`;
}
function finish(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>إنهاء الرحلة؟</h2><p>الراوي هيحوّل اللي حصل لحد دلوقتي لرواية قصيرة تقدروا تشاركوها.</p><button class="pri" onclick="closeM();novel()">اكتب الرواية</button><button class="ch" onclick="closeM()">لسه، نكمل</button></div></div>`;
}

async function novel(){
  if(busy)return;busy=true;
  const dead=S.players.filter(p=>p.hp<=0).map(p=>p.name);
  const stats=`قتلى: ${S.kills}، مستوى: ${S.level}، مشاهد: ${S.n}، الحلفاء: ${S.allies.map(a=>a.name).join('، ')||'لا أحد'}، الموتى: ${dead.join('، ')||'لا أحد'}، النهاية: ${S.over||'الفريق قرر ينهي الرحلة هنا'}`;
  const u=`الكارثة: ${S.sc}\nمكان البداية: ${S.place}\nالمقدمة: ${S.prologue||''}\nهدف الرحلة: ${S.goal||''}\nالأبطال: ${S.players.map(p=>`${p.name} (${p.role}، ${p.trait}، هدف سري: ${p.goal}${p.power?'، قوة: '+p.power:''})`).join(' / ')}\nالأحداث بالترتيب: ${S.beats.map((b,i)=>`${i+1}) ${b}${S.log[i]?' ← اختاروا: '+S.log[i].c:''}`).join('\n')}\nعواقب: ${S.seeds.join(' | ')}\nآخر مشهد: ${S.scene?S.scene.text:''}\nإحصائيات: ${stats}`;
  const sys='إنت روائي. حوّل أحداث رحلة النجاة دي لرواية قصيرة بلغة عربية فصحى أدبية جميلة وسليمة، حوالي 900 إلى 1300 كلمة، مقسمة لـ 3 إلى 5 فصول بعناوين، وليها عنوان رئيسي. استخدم أسماء الأبطال وقراراتهم الحقيقية وعواقبها، واكتب حوارات ووصف، وخلّي النهاية متسقة مع إحصائيات الرحلة. متضيفش أحداث كبيرة من عندك. اكتب النص بس.';
  $('app').innerHTML=`<h2>الرواية</h2><div class="tape"></div><div class="novel" id="nv"><span class="mut">الراوي بيكتب رحلتكم...</span></div>`;
  try{
    const t=await stream(sys,u,3000,t=>$('nv').textContent=t);
    busy=false;S.novel=t;save();
    $('app').innerHTML=`<div class="novel">${esc(t)}</div><div class="tape" style="margin-top:20px"></div>
    <div class="box mut">${esc(stats)}</div>
    <button class="pri" onclick="shareN()">مشاركة الرواية</button>
    <button class="ch" onclick="home()">الرئيسية</button>`;
  }catch(e){busy=false;$('app').innerHTML=`<div class="box err">حصل خطأ: ${esc(e.message)}</div><button class="pri" onclick="novel()">حاول تاني</button><button class="ch" onclick="game()">رجوع</button>`}
}
function shareN(){
  const t=S.novel;
  if(navigator.share)navigator.share({title:'رحلتنا في آخر الدنيا',text:t}).catch(()=>{});
  else navigator.clipboard.writeText(t).then(()=>alert('اتنسخت الرواية'));
}
home();
if(!cfg().key)setTimeout(settings,300);
</script>
</body>
</html>
