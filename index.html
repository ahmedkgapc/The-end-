<meta name="theme-color" content="#1a2123">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آخر الدنيا">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a2123;--panel:#232c2f;--line:#37444a;--tx:#ebe7da;--mut:#93a0a3;--hz:#d4a72c;--red:#c4513f;--grn:#7fae6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.9 Tajawal,system-ui,sans-serif;padding:14px 14px 90px;max-width:560px;margin-inline:auto}
h1,h2,h3{font-family:'Reem Kufi',Tajawal,sans-serif;margin:.3em 0}
h1{font-size:2.4rem;color:var(--hz);letter-spacing:0}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--hz) 0 14px,#1a2123 14px 28px);margin:6px 0 16px;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hz);outline-offset:2px}
.pri{background:var(--hz);color:#1a2123;border:0;font-weight:700;width:100%;padding:13px}
.ch{display:block;width:100%;text-align:right;margin:8px 0;padding:13px 14px;line-height:1.7}
.ch.sel{border-color:var(--hz);background:#2e3a3d}
input,select,textarea{background:#151b1d;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.9rem;text-align:center}
.res div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 2px}
.res b{display:block;font-size:1.1rem}
.low{border-color:var(--red)!important;color:#f0a090}
.pl{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pl>div{min-width:112px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.88rem;line-height:1.5}
.bar{height:5px;background:#101617;border-radius:3px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:3px}
.dead{opacity:.45}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.rl{padding:8px 2px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.rl span{font-size:1.5rem}
.rl.on{border-color:var(--hz);background:#2e3a3d;color:var(--hz)}
.pc div{padding:6px 10px;border-radius:8px;font-size:.92rem;line-height:1.6;margin-top:6px}
.pro{background:#22331f;border:1px solid #3d5c36}
.con{background:#3a2420;border:1px solid #6b3a31}
.scene{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--hz);border-radius:10px;padding:14px 16px;margin:10px 0 14px}
.lt{color:var(--hz);font-family:'Reem Kufi',sans-serif;margin-inline-end:8px}
.ch:active{transform:scale(.99)}
.acts{gap:6px}
.acts button{flex:1 1 44%;padding:10px 6px;font-size:.9rem}
.story{white-space:pre-wrap;font-size:1.08rem;line-height:2.05}
.mut{color:var(--mut);font-size:.9rem}
.err{color:#f0a090}
.bottom{position:fixed;inset:auto 0 0 0;background:#141a1c;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;max-width:560px;margin:auto}
.bottom button{flex:1;padding:9px 4px;font-size:.92rem}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;border:1px solid var(--line)}
.tm{height:6px;background:var(--red);border-radius:3px;transition:width 1s linear}
.sk{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.sk button{padding:2px 12px;flex:0}
.novel{font-size:1.1rem;line-height:2.2;white-space:pre-wrap}

.i{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
body{max-width:480px;padding-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;font:600 1rem 'Reem Kufi',sans-serif;color:var(--hz);padding:4px 2px 10px}
.top .mut{font:400 .8rem Tajawal}
.res div{background:linear-gradient(180deg,#2a3539,#232c2f);border-radius:10px;padding:5px 2px}
.res .i{width:1.3em;height:1.3em;color:var(--hz)}
.res .low .i{color:var(--red)}
.pro .i{color:var(--grn)}.con .i{color:#e08a78}
.ch{border-radius:12px;background:linear-gradient(180deg,#283236,#232c2f)}
.lt{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border:1px solid var(--hz);border-radius:50%;font-size:.85rem;line-height:1}
.bottom{max-width:480px;gap:4px;border-radius:18px 18px 0 0}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;line-height:1.3;padding:8px 2px;border:0;background:transparent;color:var(--mut)}
.bottom button .i{width:1.7em;height:1.7em;color:var(--hz)}
.hero{text-align:center;padding:26px 0 6px}
.emb{width:84px;height:84px;margin:0 auto 6px;display:grid;place-items:center;border-radius:24px;background:var(--hz);color:#1a2123;box-shadow:0 0 0 6px #d4a72c22}
.emb .i{width:48px;height:48px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.mi{display:flex;align-items:center;gap:12px;text-align:right;padding:14px;border-radius:14px;background:linear-gradient(180deg,#283236,#232c2f)}
.mi>.i:first-child{width:1.9em;height:1.9em;color:var(--hz)}
.mi span{flex:1;display:flex;flex-direction:column;line-height:1.4}
.mi small{color:var(--mut);font-size:.8rem}
.mi>.i:last-child{color:var(--mut)}
.mi.main{background:var(--hz);color:#1a2123;border:0}
.mi.main small,.mi.main .i{color:#1a2123!important}
.stamp{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--red);color:var(--red);padding:1px 10px;border-radius:4px;font:700 .8rem 'Reem Kufi';transform:rotate(-2deg)}
.mi-sec{display:flex;gap:8px;align-items:center;margin:18px 0 6px;color:var(--hz);font:600 .95rem 'Reem Kufi'}
.mi-sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.dos{position:relative;background:linear-gradient(180deg,#273135,#1f282b);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;margin:14px 0;overflow:hidden}
.dos:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:repeating-linear-gradient(-45deg,var(--hz) 0 10px,#1a2123 10px 20px)}
.dh{display:flex;align-items:center;gap:8px;margin:6px 0 8px;color:var(--hz);font:600 .95rem 'Reem Kufi'}
.dh .rk{margin-inline-start:auto;background:var(--hz);color:#1a2123;padding:1px 10px;border-radius:4px;font-size:.85rem}
.fl{display:block;font-size:.78rem;color:var(--mut);margin:8px 0 4px}
.rl{background:#161d1f;border-radius:10px;padding:10px 2px;gap:4px}
.rl .i{width:1.7em;height:1.7em}
.rl.on{border-color:var(--hz);background:#2b3326;box-shadow:0 0 0 1px var(--hz) inset,0 0 14px #d4a72c33}

{"choices":["اختيار","اختيار","اختيار"],"fx":{"food":0,"water":0,"meds":0,"fuel":0,"ammo":0,"morale":0,"trust":0,"def":0},"kills":0,"hurt":{"0":0},"ally":null,"allyFx":[],"betray":null,"gone":[],"choicesOut":[],"choicesIn":[],"beat":"سطر واحد بيلخص اللي حصل","seed":null,"timer":false,"boss":false,"split":false,"power":null,"status":[],"cure":[],"end":null}

لهجمات. عندما يكون الفريق في الملجأ قد تقع أحداث داخله: هجوم أو تسلل أو مرض أو نزاع أو سرقة أو زائر غريب، وكلما قل التحصين زادت الخطورة. وإذا كانت الموارد قليلة (طعام أو ماء 2 فأقل) فاجعل الجو ضاغطاً ويلمّح إلى الحاجة للخروج. الانقسام: إذا ذُكر في الحالة أن مجموعة في الخارج ومجموعة في الملجأ فاسرد ما يحدث للمجموعتين معاً (ابدأ الجزء الأول بـ «في الخارج:» والثاني بـ «في الملجأ:»)، وقد يصيب الأذى أياً منهما، وما تجلبه البعثة يظهر في fx، ومهارات الخارجين تؤثر في نجاحها. ضع split:true إذا بقيت المجموعتان منفصلتين لمشهد آخر، وإلا ضع false لتعود المجموعتان معاً. قرارات الفريق قد تكون إجراءً مثل التحصين أو الراحة أو الاستطلاع فاجعل لها أثراً واقعياً. الناجون: قد يقابل الفريق ناجين؛ إذا أُنقذوا فأضفهم مرة واحدة في ally كائناً {"name":"","skill":"مهارة تفيد الفريق"}. للحلفاء ثقة من 0 إلى 10 تراها في الحالة: غيّرها بـ allyFx:[{"name":"","trust":1}] حسب معاملة الفريق لهم (مشاركة الطعام والحماية والصدق ترفعها، والتخلي والكذب والتضحية بهم تخفضها). الحليف ذو الثقة 2 فأقل قد يخون في أي وقت (سرقة المؤن، كشف الموقع، الهروب) فاستعمل betray:"اسمه" مع الأثر في fx وhurt، والثقة 8 فأكثر تجعله وفياً يضحي ويساعد. استعمل gone:["اسم"] لمن يموت أو يغادر، وأشرك الحلفاء بمهاراتهم في المشاهد. عند الانقسام (split:true) أرجع choicesOut لمن في الخارج وchoicesIn لمن في الملجأ (من 3 إلى 4 اختيارات لكل مجموعة، مختلفة وتناسب موقف كل منهما) واترك choices فارغة؛ الحدثان يجريان في الوقت نفسه ويؤثر قرار كل مجموعة في الأخرى وفي المستقبل. في المشهد التالي يصلك قرارا المجموعتين معاً فاسرد النتيجتين المتزامنتين وأثر كل قرار في الآخر، وأعد الجميع للاجتماع (split:false) خلال مشهدين أو ثلاثة. غير الأماكن والأحداث والجوائح، ومتكررش. المشهد رقم 14 فما فوق: ابدأ تمهد لنهاية، وحط end="win" أو "lose" أو "twist" لما القصة توصل نهاية طبيعية (النجاة، ملجأ، كشف سبب الجائحة، أو نهاية مأساوية). مفيش end قبل المشهد 10 إلا لو الكل مات.`;

function icoify(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;
  while(n=w.nextNode())if(RT.test(n.data)&&!/^(TEXTAREA|SCRIPT|STYLE)$/.test(n.parentNode.nodeName))L.push(n);
  L.forEach(n=>{const t=document.createElement('template');t.innerHTML=esc(n.data).replace(RX,(m,k)=>ic(IM[k]));n.replaceWith(t.content)})}
new MutationObserver(ms=>ms.forEach(r=>r.addedNodes.forEach(x=>x.nodeType==1?icoify(x):x.nodeType==3&&x.parentNode&&icoify(x.parentNode)))).observe(document.body,{childList:true,subtree:true});

async function stream(system,user,max,onText){
  const c=cfg(),g=c.prov==='gemini';
  const url=g?`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:streamGenerateContent?alt=sse`:'https://api.anthropic.com/v1/messages';
  const headers=g?{'content-type':'application/json','x-goog-api-key':c.key}:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  const body=g?{systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:max+4000,temperature:1}}
             :{model:c.model,max_tokens:max,stream:true,system,messages:[{role:'user',content:user}]};
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  if(!r.ok){let t='';try{const e=await r.json();t=e.error.message}catch(e){}
    throw new Error(r.status===429?'خلصت الحصة المجانية دلوقتي، جرّبوا بعد شوية أو بكرة. ':(r.status+' '+t))}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='',full='';
  for(;;){const{done,value}=await rd.read();if(done)break;
    buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:'))continue;
      try{const j=JSON.parse(l.slice(5));let t='';
        if(g){t=((j.candidates||[])[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('')}
        else if(j.type==='content_block_delta'&&j.delta.text)t=j.delta.text;
        if(t){full+=t;onText(full)}}catch(e){}}}
  return full;
}

function parseScene(full){

  const text=full.slice(0,i).replace(/```\w*/g,'').trim();
  const m=full.slice(i+k).match(/\{[\s\S]*\}/);if(!m||!text)throw 0;
  return{text,j:JSON.parse(m[0])}
}
async function next(choice){

function apply(j){
  const fx=j.fx||{};for(const k in S.res)S.res[k]=Math.max(0,Math.min(10,S.res[k]+(+fx[k]||0)));
  for(const k in (j.hurt||{})){const p=S.players[+k];if(p)p.hp=Math.max(0,p.hp-(+j.hurt[k]||0))}
  if(S.res.food==0||S.res.water==0)S.players.forEach(p=>p.hp=Math.max(0,p.hp-6));
  S.kills+=+j.kills||0;
  if(j.beat)S.beats.push(j.beat);if(j.seed)S.seeds.push(j.seed);
  if(j.power&&S.players[j.power.p]&&!S.players[j.power.p].power)S.players[j.power.p].power=j.power.text;
  while(S.kills>=S.level*5){S.level++;S.players.forEach(p=>p.pts+=3);S.lvlUp=true}
  applyFx(j);
}
const INJ=[{name:'جرح في الساق',sk:{سرعة:-1},text:'يعرج ويتباطأ.'},{name:'ذراع مصابة',sk:{قوة:-1},text:'تضعف قبضته.'},{name:'إرهاق شديد',sk:{تحمل:-1},text:'يتعب سريعاً.'},{name:'ارتجاج خفيف',sk:{تخفي:-1,صيد:-1},text:'يفقد تركيزه.'}];
const FXI={buff:'⬆️',debuff:'⬇️',injury:'🩹'};
function effSk(p){const o={...p.sk};(p.fx||[]).forEach(f=>{for(const k in (f.sk||{}))if(k in o)o[k]=Math.max(0,o[k]+(+f.sk[k]||0))});return o}
function applyFx(j){
  S.news=[];applyAllies(j);
  S.players.forEach(p=>{p.fx=(p.fx||[]).map(f=>f.left==null?f:{...f,left:f.left-1}).filter(f=>f.left==null||f.left>0)});
  const gotInj={};
  (j.status||[]).slice(0,3).forEach(x=>{const p=S.players[+x.p];if(!p||!x.name)return;
    const type=['buff','debuff','injury'].includes(x.type)?x.type:'debuff';
    const left=+x.scenes>0?Math.min(6,+x.scenes):null;
    const sk={};for(const k in (x.sk||{}))if(SK.includes(k))sk[k]=Math.max(-3,Math.min(3,+x.sk[k]||0));
    p.fx=(p.fx||[]).filter(f=>f.name!==x.name);
    p.fx.push({name:String(x.name).slice(0,30),type,sk,left,text:String(x.text||'').slice(0,120)});
    if(type==='injury')gotInj[x.p]=1;
    S.news.push(`${FXI[type]} ${p.name}: ${x.name}`)});
  (j.cure||[]).forEach(c=>{const p=S.players[+c.p];if(!p)return;const n=(p.fx||[]).length;
    p.fx=(p.fx||[]).filter(f=>!(c.name?f.name.includes(c.name):f.type==='injury'));
    if(p.fx.length<n)S.news.push(`💚 ${p.name} تعافى من إصابته`)});
  for(const k in (j.hurt||{})){const p=S.players[+k];
    if(p&&p.hp>0&&(+j.hurt[k]||0)>=25&&!gotInj[k]){const q=INJ[Math.floor(Math.random()*INJ.length)];
      if(!(p.fx||[]).some(f=>f.name===q.name)){p.fx=(p.fx||[]).concat([{...q,type:'injury',left:3}]);S.news.push(`🩹 ${p.name}: ${q.name}`)}}}
}
function applyAllies(j){
  if(j.ally){const a=typeof j.ally==='string'?{name:j.ally}:j.ally;
    if(a&&a.name&&!S.allies.some(x=>x.name===a.name)){S.allies.push({name:String(a.name).slice(0,24),skill:String(a.skill||'').slice(0,40),trust:5});S.news.push('🤝 انضم إلى الفريق: '+a.name)}}

}

  <button onclick="pickCustom(ACTS.fort)">🛠️ تحصين الملجأ</button>
  <button onclick="pickCustom(ACTS.rest)">😴 راحة وتعافٍ</button>
  <button onclick="pickCustom(ACTS.scout)">🔍 استطلاع</button>${S.allies.length?'<button onclick="pickCustom(ACTS.bond)">🤝 اكسبوا ثقة الحلفاء</button>':''}</div>`}
let PEND=null,PSPLIT=null,EX=null;
function goPend(){if(PSPLIT){S.split=PSPLIT;PSPLIT=null}next(PEND)}
function pickCustom(t,sp){PEND=t;PSPLIT=sp||null;
  if(S.players.length==1){goPend();return}
  document.querySelectorAll('.ch').forEach(b=>b.classList.remove('sel'));
  $('cf').innerHTML=`<div class="box"><b>${esc(t)}</b><br>كل اللاعبين موافقين؟<div class="row" style="margin-top:8px"><button class="pri" onclick="goPend()">كلنا موافقين ✓</button><button onclick="PSPLIT=null;$('cf').innerHTML=''">لسه بنتناقش</button></div></div>`}
function expo(){const alive=S.players.map((p,i)=>i).filter(i=>S.players[i].hp>0);if(!alive.length)return;
  EX={out:alive.length==1?[alive[0]]:[],tg:S.res.food<=S.res.water?'الطعام':'الماء'};drawEx()}
function drawEx(){const alive=S.players.map((p,i)=>i).filter(i=>S.players[i].hp>0),solo=alive.length==1;
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>${solo?'الخروج للتموين':'بعثة تموين'}</h2>
  <p class="mut">${solo?'ستخرج وحدك، وسيبقى الملجأ بلا حارس.':'اختاروا من يخرج، ويبقى الباقون في الملجأ. الخارجون يواجهون الطريق، والباقون قد يواجهون ما يقع في الملجأ.'}</p>
  ${alive.map(i=>{const p=S.players[i],on=EX.out.includes(i);return `<button class="ch ${on?'sel':''}" ${solo?'disabled':''} onclick="exTog(${i})">${ROLES[p.role].e} ${esc(p.name)} <span class="mut">${p.role} · صحة ${p.hp}</span> ${on?'🚪 يخرج':'🏠 يبقى'}</button>`}).join('')}
  <label>عن ماذا تبحث البعثة؟</label><select onchange="EX.tg=this.value">${['الطعام','الماء','الدواء','الوقود','الذخيرة'].map(t=>`<option ${EX.tg==t?'selected':''}>${t}</option>`).join('')}</select>
  <div style="height:10px"></div><button class="pri" onclick="exGo()">انطلقوا</button></div></div>`}
function exTog(i){const k=EX.out.indexOf(i);if(k>=0)EX.out.splice(k,1);else EX.out.push(i);drawEx()}
function exGo(){const alive=S.players.map((p,i)=>i).filter(i=>S.players[i].hp>0),out=EX.out;
  if(!out.length){alert('اختاروا من سيخرج');return}
  if(alive.length>1&&out.length>=alive.length){alert('يجب أن يبقى أحد في الملجأ');return}
  const inside=alive.filter(i=>!out.includes(i)),n=a=>a.map(i=>S.players[i].name).join('، ');
  closeM();
  pickCustom(inside.length?`أرسل الفريق بعثة تموين للبحث عن ${EX.tg}: يخرج ${n(out)} ويبقى في الملجأ ${n(inside)}`:`خرج ${n(out)} وحده للبحث عن ${EX.tg}`,{out,inside,tg:EX.tg,turns:0})}
let DP={o:null,i:null};
function dualHtml(sc){const n=a=>a.map(i=>S.players[i]?S.players[i].name:'').join('، ');
  const side=(t,names,arr,k)=>`<div class="box"><b>${t}</b> <span class="mut">${esc(names)}</span>${arr.map((c,i)=>`<button class="ch d${k}" onclick="pickD('${k}',${i})"><b class="lt">${'أبجد'[i]}</b>${esc(c)}</button>`).join('')}</div>`;
  return side('🚪 في الخارج',n(S.split.out),sc.dual.out,'o')+side('🏠 في الملجأ',n(S.split.inside),sc.dual.inn,'i')}
function sendDual(){const sc=S.scene,n=a=>a.map(i=>S.players[i]?S.players[i].name:'').join('، ');
  next(`في الخارج (${n(S.split.out)}) اختاروا: ${sc.dual.out[DP.o]} | في الملجأ (${n(S.split.inside)}) اختاروا: ${sc.dual.inn[DP.i]}`)}
function pickD(k,i){DP[k]=i;document.querySelectorAll('.d'+k).forEach((b,x)=>b.classList.toggle('sel',x==i));
  if(DP.o==null||DP.i==null)return;
  if(S.split.out.length<2&&S.split.inside.length<2){sendDual();return}
  $('cf').innerHTML=`<div class="box"><b>قرار المجموعتين</b><br>هل اتفق أفراد كل مجموعة على قرارها؟<div class="row" style="margin-top:8px"><button class="pri" onclick="sendDual()">اتفقنا ✓</button><button onclick="$('cf').innerHTML=''">لسه بنتناقش</button></div></div>`}
function timeUp(){const sc=S.scene,r=n=>Math.floor(Math.random()*n);
  if(sc.dual&&S.split){if(DP.o==null)DP.o=r(sc.dual.out.length);if(DP.i==null)DP.i=r(sc.dual.inn.length);sendDual()}
  else confirmPick(r(sc.choices.length))}
function heal(i){const p=S.players[i];if(!p||p.hp<=0)return;
  if(S.scene&&S.scene.timer&&!S.over){alert('لا وقت للعلاج في لحظة الخطر!');return}
  if(S.res.meds<1)return;
  S.res.meds--;const k=(p.fx||[]).findIndex(f=>f.type==='injury');if(k>=0)p.fx.splice(k,1);
  p.hp=Math.min(100,p.hp+15);S.news=['💊 عولج '+p.name];save();closeM();game()}

let picked=null;
function game(){
  clearInterval(tmr);picked=null;DP={o:null,i:null};
  if(!S.scene){S&&S.prologue?intro():home();return}
  if(S.res.def==null)S.res.def=3;
  S.allies=(S.allies||[]).map(a=>typeof a==='string'?{name:a,skill:'',trust:5}:a);
  const sc=S.scene,pts=S.players.reduce((a,p)=>a+p.pts,0);
  const lv=S.lvlUp?`<div class="box" style="border-color:var(--hz)">⭐ الفريق وصل المستوى ${S.level}! كل لاعب أخد 3 نقاط تطوير.</div>`:'';S.lvlUp=false;
  $('app').innerHTML=`
  <div class="top"><span>${ic('shield')} آخر الدنيا</span><span class="mut">مشهد ${S.n} · مستوى ${S.level}</span></div>
  <div class="res">${Object.keys(RES).map(k=>`<div class="${S.res[k]<=1?'low':''}">${RES[k].split(' ')[0]}<b>${S.res[k]}</b><span class="mut">${RES[k].split(' ')[1]}</span></div>`).join('')}<div>⚔️<b>${S.kills}</b><span class="mut">قتلى</span></div></div>
  ${defLine()}<div class="pl" style="margin-top:8px">${S.players.map(p=>`<div class="${p.hp<=0?'dead':''}"><b>${ROLES[p.role].e} ${esc(p.name)}</b><br><span class="mut">${p.role}</span> ${(p.fx||[]).map(f=>FXI[f.type]||'').join('')}<div class="bar"><i style="width:${p.hp}%;background:${p.hp>60?'var(--grn)':p.hp>30?'var(--hz)':'var(--red)'}"></i></div>${p.hp<=0?'مات':''}${p.power?'<br>✨ '+esc(p.power):''}</div>`).join('')}</div>
  <div class="tape" style="margin-top:12px"></div>
  ${lv}${splitBox()}${newsBox()}${sc.boss?'<div class="mut" style="color:var(--red)">⚠️ زعيم المرحلة</div>':''}
  <div class="scene"><div class="mut">المشهد ${S.n}</div><div class="story">${esc(sc.text)}</div></div>
  ${S.over?endBox():`${sc.timer?'<div class="mut">قرروا بسرعة!</div><div class="tm" id="tm" style="width:100%"></div>':''}
  <div id="chs">${sc.dual&&S.split?dualHtml(sc):sc.choices.map((c,i)=>`<button class="ch" onclick="pick(${i})"><b class="lt">${'أبجد'[i]}</b>${esc(c)}</button>`).join('')}</div><div id="cf"></div>${S.split?'':acts()}`}
  <div class="bottom"><button onclick="upg()">🔧 تطوير${pts?' ('+pts+')':''}</button><button onclick="team()">👥 الفريق</button><button onclick="code()">💾 كود</button><button onclick="finish()">📖 نهاية</button></div>`;
  if(sc.timer&&!S.over){let t=12;tmr=setInterval(()=>{t--;const b=$('tm');if(b)b.style.width=(t/12*100)+'%';if(t<=0){clearInterval(tmr);timeUp()}},1000)}
}
function endBox(){return `<div class="box" style="border-color:var(--hz)"><b>${{win:'نجوتوا! 🎉',lose:'الرحلة انتهت بمأساة 💀',twist:'نهاية مفاجئة...'}[S.over]||'النهاية'}</b><p class="mut">دلوقتي الراوي هيكتب رحلتكم كلها كرواية قصيرة.</p><button class="pri" onclick="novel()">اكتب الرواية</button></div>`}
function pick(i){
  if(S.players.length==1){confirmPick(i);return}
  picked=i;document.querySelectorAll('.ch').forEach((b,k)=>b.classList.toggle('sel',k==i));
  $('cf').innerHTML=`<div class="box"><b>كل اللاعبين موافقين على الاختيار ده؟</b><div class="row" style="margin-top:8px"><button class="pri" onclick="confirmPick(${i})">كلنا موافقين ✓</button><button onclick="$('cf').innerHTML='';document.querySelectorAll('.ch').forEach(b=>b.classList.remove('sel'))">لسه بنتناقش</button></div></div>`;
}
function confirmPick(i){clearInterval(tmr);next(S.scene.choices[i])}

function team(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>${S.players.length>1?'الفريق':'بطلك'}</h2>
  ${S.players.map((p,i)=>{const R=ROLES[p.role],T=TRAITS[p.trait]||{pro:'',con:''},E=effSk(p);
  const hurt=(p.fx||[]).some(f=>f.type==='injury')||p.hp<100;
  return `<div class="box"><h3>${R.e} ${esc(p.name)} <span class="mut">${p.role} · ${p.trait} · صحة ${p.hp}</span></h3>
  <div class="mut">${SK.map(k=>k+' '+E[k]+(E[k]!==p.sk[k]?(E[k]>p.sk[k]?' ⬆️':' ⬇️'):'')).join(' · ')}</div>
  <div class="pc"><div class="pro">✅ ${R.pro}</div><div class="con">⚠️ ${R.con}</div><div class="pro">✅ سمة ${p.trait}: ${T.pro}</div><div class="con">⚠️ ${T.con}</div>${p.power?'<div class="pro">✨ '+esc(p.power)+'</div>':''}${fxHtml(p,true)}</div>
  ${p.hp>0&&hurt?`<button style="margin-top:8px" ${S.res.meds<1?'disabled':''} onclick="heal(${i})">💊 عالج (يستهلك دواء، المتبقي ${S.res.meds})</button>`:''}
  <button style="margin-top:8px" onclick="goal(${i})">${S.players.length>1?'هدفي السري (صاحبه فقط يرى)':'هدفك السري'}</button><div id="g${i}" class="mut"></div></div>`}).join('')}
  ${S.allies.length?`<div class="box"><h3>🤝 الحلفاء</h3>${S.allies.map(a=>`<div style="margin:10px 0"><b>${esc(a.name)}</b> <span class="mut">${esc(a.skill||'')}</span><div class="bar"><i style="width:${a.trust*10}%;background:${a.trust<=2?'var(--red)':a.trust<=4?'var(--hz)':'var(--grn)'}"></i></div><span class="mut">ثقة ${a.trust}/10 · ${a.trust<=2?'⚠️ قد يخونكم في أي لحظة':a.trust<=4?'متردد':a.trust>=8?'وفيّ لكم':'يثق بكم'}</span></div>`).join('')}</div>`:''}
  <p class="mut">المستوى ${S.level}، قتلى ${S.kills}. المستوى التالي عند ${S.level*5} قتيل.</p></div></div>`;
}
function goal(i){const e=$('g'+i);e.textContent=e.textContent?'':S.players[i].goal}
function upg(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>نقاط التطوير</h2>
  ${S.players.map((p,i)=>`<div class="box"><b>${esc(p.name)}</b> <span class="mut">نقاط: ${p.pts}</span>${SK.map(k=>`<div class="sk"><span>${k} (${p.sk[k]})</span><button ${p.pts?'':'disabled'} onclick="up(${i},'${k}')">+</button></div>`).join('')}</div>`).join('')}</div></div>`;
}
function up(i,k){const p=S.players[i];if(p.pts>0){p.pts--;p.sk[k]++;save();upg();if(S.players.every(x=>!x.pts))game()}}

function code(){
  const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>كود الحفظ</h2><p class="mut">الرحلة بتتحفظ تلقائي. انسخوا الكود ده لو عايزين تكملوا من جهاز تاني.</p><textarea id="cd" rows="5" dir="ltr" readonly>${c}</textarea><div class="row" style="margin-top:8px"><button class="pri" onclick="$('cd').select();navigator.clipboard&&navigator.clipboard.writeText($('cd').value);this.textContent='اتنسخ ✓'">نسخ</button><button onclick="closeM();home()">خروج للرئيسية</button></div></div></div>`;
}
function loadCode(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>تحميل رحلة</h2><textarea id="cd" rows="5" dir="ltr" placeholder="الصقوا الكود هنا"></textarea><div style="height:8px"></div><button class="pri" onclick="try{S=JSON.parse(decodeURIComponent(escape(atob($('cd').value.trim()))));save();closeM();game()}catch(e){this.textContent='الكود غلط'}">تحميل</button></div></div>`;
}
function finish(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>إنهاء الرحلة؟</h2><p>الراوي هيحوّل اللي حصل لحد دلوقتي لرواية قصيرة تقدروا تشاركوها.</p><button class="pri" onclick="closeM();novel()">اكتب الرواية</button><button class="ch" onclick="closeM()">لسه، نكمل</button></div></div>`;
}

async function novel(){
  if(busy)return;busy=true;
  const dead=S.players.filter(p=>p.hp<=0).map(p=>p.name);
  const stats=`قتلى: ${S.kills}، مستوى: ${S.level}، مشاهد: ${S.n}، الحلفاء: ${S.allies.map(a=>a.name).join('، ')||'لا أحد'}، الموتى: ${dead.join('، ')||'لا أحد'}، النهاية: ${S.over||'الفريق قرر ينهي الرحلة هنا'}`;
  const u=`الكارثة: ${S.sc}\nمكان البداية: ${S.place}\nالمقدمة: ${S.prologue||''}\nهدف الرحلة: ${S.goal||''}\nالأبطال: ${S.players.map(p=>`${p.name} (${p.role}، ${p.trait}، هدف سري: ${p.goal}${p.power?'، قوة: '+p.power:''})`).join(' / ')}\nالأحداث بالترتيب: ${S.beats.map((b,i)=>`${i+1}) ${b}${S.log[i]?' ← اختاروا: '+S.log[i].c:''}`).join('\n')}\nعواقب: ${S.seeds.join(' | ')}\nآخر مشهد: ${S.scene?S.scene.text:''}\nإحصائيات: ${stats}`;
  const sys='إنت روائي. حوّل أحداث رحلة النجاة دي لرواية قصيرة بلغة عربية فصحى أدبية جميلة وسليمة، حوالي 900 إلى 1300 كلمة، مقسمة لـ 3 إلى 5 فصول بعناوين، وليها عنوان رئيسي. استخدم أسماء الأبطال وقراراتهم الحقيقية وعواقبها، واكتب حوارات ووصف، وخلّي النهاية متسقة مع إحصائيات الرحلة. متضيفش أحداث كبيرة من عندك. اكتب النص بس.';
  $('app').innerHTML=`<h2>الرواية</h2><div class="tape"></div><div class="novel" id="nv"><span class="mut">الراوي بيكتب رحلتكم...</span></div>`;
  try{
    const t=await stream(sys,u,3000,t=>$('nv').textContent=t);
    busy=false;S.novel=t;save();
    $('app').innerHTML=`<div class="novel">${esc(t)}</div><div class="tape" style="margin-top:20px"></div>
    <div class="box mut">${esc(stats)}</div>
    <button class="pri" onclick="shareN()">مشاركة الرواية</button>
    <button class="ch" onclick="home()">الرئيسية</button>`;
  }catch(e){busy=false;$('app').innerHTML=`<div class="box err">حصل خطأ: ${esc(e.message)}</div><button class="pri" onclick="novel()">حاول تاني</button><button class="ch" onclick="game()">رجوع</button>`}
}
function shareN(){
  const t=S.novel;
  if(navigator.share)navigator.share({title:'رحلتنا في آخر الدنيا',text:t}).catch(()=>{});
  else navigator.clipboard.writeText(t).then(()=>alert('اتنسخت الرواية'));
}
home();
if(!cfg().key)setTimeout(settings,300);
</script>
</body>
</html>
