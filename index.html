<meta name="theme-color" content="#1a2123">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="آخر الدنيا">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a2123;--panel:#232c2f;--line:#37444a;--tx:#ebe7da;--mut:#93a0a3;--hz:#d4a72c;--red:#c4513f;--grn:#7fae6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.9 Tajawal,system-ui,sans-serif;padding:14px 14px 90px;max-width:560px;margin-inline:auto}
h1,h2,h3{font-family:'Reem Kufi',Tajawal,sans-serif;margin:.3em 0}
h1{font-size:2.4rem;color:var(--hz);letter-spacing:0}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--hz) 0 14px,#1a2123 14px 28px);margin:6px 0 16px;border-radius:2px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--hz);outline-offset:2px}
.pri{background:var(--hz);color:#1a2123;border:0;font-weight:700;width:100%;padding:13px}
.ch{display:block;width:100%;text-align:right;margin:8px 0;padding:13px 14px;line-height:1.7}
.ch.sel{border-color:var(--hz);background:#2e3a3d}
input,select,textarea{background:#151b1d;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.9rem;text-align:center}
.res div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 2px}
.res b{display:block;font-size:1.1rem}
.low{border-color:var(--red)!important;color:#f0a090}
.pl{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.pl>div{min-width:112px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.88rem;line-height:1.5}
.bar{height:5px;background:#101617;border-radius:3px;margin-top:3px}
.bar i{display:block;height:100%;background:var(--grn);border-radius:3px}
.dead{opacity:.45}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.rl{padding:8px 2px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.rl span{font-size:1.5rem}
.rl.on{border-color:var(--hz);background:#2e3a3d;color:var(--hz)}
.pc div{padding:6px 10px;border-radius:8px;font-size:.92rem;line-height:1.6;margin-top:6px}
.pro{background:#22331f;border:1px solid #3d5c36}
.con{background:#3a2420;border:1px solid #6b3a31}
.scene{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--hz);border-radius:10px;padding:14px 16px;margin:10px 0 14px}
.lt{color:var(--hz);font-family:'Reem Kufi',sans-serif;margin-inline-end:8px}
.ch:active{transform:scale(.99)}
.acts{gap:6px}
.acts button{flex:1 1 44%;padding:10px 6px;font-size:.9rem}
.story{white-space:pre-wrap;font-size:1.08rem;line-height:2.05}
.mut{color:var(--mut);font-size:.9rem}
.err{color:#f0a090}
.bottom{position:fixed;inset:auto 0 0 0;background:#141a1c;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;max-width:560px;margin:auto}
.bottom button{flex:1;padding:9px 4px;font-size:.92rem}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;border:1px solid var(--line)}
.tm{height:6px;background:var(--red);border-radius:3px;transition:width 1s linear}
.sk{display:flex;justify-content:space-between;align-items:center;padding:3px 0}
.sk button{padding:2px 12px;flex:0}
.novel{font-size:1.1rem;line-height:2.2;white-space:pre-wrap}

.i{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
body{max-width:480px;padding-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;font:600 1rem 'Reem Kufi',sans-serif;color:var(--hz);padding:4px 2px 10px}
.top .mut{font:400 .8rem Tajawal}
.res div{background:linear-gradient(180deg,#2a3539,#232c2f);border-radius:10px;padding:5px 2px}
.res .i{width:1.3em;height:1.3em;color:var(--hz)}
.res .low .i{color:var(--red)}
.pro .i{color:var(--grn)}.con .i{color:#e08a78}
.ch{border-radius:12px;background:linear-gradient(180deg,#283236,#232c2f)}
.lt{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border:1px solid var(--hz);border-radius:50%;font-size:.85rem;line-height:1}
.bottom{max-width:480px;gap:4px;border-radius:18px 18px 0 0}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;line-height:1.3;padding:8px 2px;border:0;background:transparent;color:var(--mut)}
.bottom button .i{width:1.7em;height:1.7em;color:var(--hz)}
.hero{text-align:center;padding:26px 0 6px}
.emb{width:84px;height:84px;margin:0 auto 6px;display:grid;place-items:center;border-radius:24px;background:var(--hz);color:#1a2123;box-shadow:0 0 0 6px #d4a72c22}
.emb .i{width:48px;height:48px}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.mi{display:flex;align-items:center;gap:12px;text-align:right;padding:14px;border-radius:14px;background:linear-gradient(180deg,#283236,#232c2f)}
.mi>.i:first-child{width:1.9em;height:1.9em;color:var(--hz)}
.mi span{flex:1;display:flex;flex-direction:column;line-height:1.4}
.mi small{color:var(--mut);font-size:.8rem}
.mi>.i:last-child{color:var(--mut)}
.mi.main{background:var(--hz);color:#1a2123;border:0}
.mi.main small,.mi.main .i{color:#1a2123!important}
.stamp{display:inline-flex;gap:6px;align-items:center;border:2px solid var(--red);color:var(--red);padding:1px 10px;border-radius:4px;font:700 .8rem 'Reem Kufi';transform:rotate(-2deg)}
.mi-sec{display:flex;gap:8px;align-items:center;margin:18px 0 6px;color:var(--hz);font:600 .95rem 'Reem Kufi'}
.mi-sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.dos{position:relative;background:linear-gradient(180deg,#273135,#1f282b);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px;margin:14px 0;overflow:hidden}
.dos:before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:repeating-linear-gradient(-45deg,var(--hz) 0 10px,#1a2123 10px 20px)}
.dh{display:flex;align-items:center;gap:8px;margin:6px 0 8px;color:var(--hz);font:600 .95rem 'Reem Kufi'}
.dh .rk{margin-inline-start:auto;background:var(--hz);color:#1a2123;padding:1px 10px;border-radius:4px;font-size:.85rem}
.fl{display:block;font-size:.78rem;color:var(--mut);margin:8px 0 4px}
.rl{background:#161d1f;border-radius:10px;padding:10px 2px;gap:4px}
.rl .i{width:1.7em;height:1.7em}
.rl.on{border-color:var(--hz);background:#2b3326;box-shadow:0 0 0 1px var(--hz) inset,0 0 14px #d4a72c33}

المحلات والسوبر ماركت والصيدلية والسيارات؛ وفي غير ذلك ما يناسبه. كل بحث يستهلك وقتاً (min من 30 إلى 90) وله مخاطره (ساكنون، مصابون، ناجون آخرون، ضجيج) وغلته متواضعة ومتفاوتة (+1 إلى +3). المعنويات من 0 إلى 10 وتتأثر بالنجاح والفقد والجوع والقتل. لا تستخدم fx.trust أبداً؛ الثقة فقط بين اللاعبين عبر ptrust. اللاعبون أحرار في قتل أي كائن، حتى الناجين العاديين، لسلب مؤنهم أو سلاحهم أو إزالة تهديد؛ نفّذ ما يختارونه بواقعية ودون وعظ أو رفض ودون تفاصيل دموية مفرطة، مع عواقب حقيقية (شهود، ثأر، تغيّر ptrust بين اللاعبين، انخفاض المعنويات، سمعة بين الناجين)، وزد kills وحدد by وأضف الغنيمة في fx. محاكاة بشرية كاملة: يصلك لكل لاعب جوع وعطش ونوم (من 100، و100 = مرتاح تماماً). الجوع يصل للصفر بعد أسبوع تقريباً، والعطش بعد 3 أيام، والنوم بعد 4 أيام (وبعدها يموت من الإرهاق)، وكلما نقصت ضعفت الشخصية: يقل استيعابها وتركيزها وسرعتها ويصعب عليها كل شيء وتسيء التقدير، وقد تغفو لحظات في وقت خطر عند الإرهاق الشديد. اسرد ذلك في تصرفاتها (تعثر، بطء، دوخة، صداع، سوء حكم) من غير ذكر الأرقام. إذا حلّ الليل (من 9 مساءً إلى 5 صباحاً) فاجعل أحد الاختيارات دائماً البحث عن مكان آمن للمبيت أو تأمينه. وإذا نام الفريق في هذا المشهد فضع sleep:true وضع في min مدة النوم (من 360 إلى 480)، واسرد مخاطر النوم (حراسة، ضجيج، مصابون، متسللون). لا تضع sleep:true إلا إذا ناموا فعلاً، ولا تعدّل أرقام الجوع والعطش والنوم. النوم والحراسة: إذا نام فريق من أكثر من لاعب فانظر في اختياره: «حراسة بالتناوب» تعني أن واحداً صاحٍ كل ساعتين يبدّل التالي، فاسرد الحارس ينتبه للخطر مبكراً فيوقظ الباقين (ويتعب هو)، وكل نائم ينام أقل. أما «من غير حراسة» فإن جاء مصابون أو متسللون ليلاً فيفاجئون النائمين بلا إنذار وبخسائر أكبر. اللاعب المنفرد لا حارس له: يبحث عن مكان آمن للنوم، فإن لم يجد أمانه فله ألا ينام الليلة ويبحث في الليلة التالية، لكن السهر المتواصل يكلف جسده وتركيزه ويقترب من الإرهاق القاتل بعد 4 أيام بلا نوم. اعرض دائماً هذا الاختيار عند حلول الليل ولا تفرض النوم. الأماكن: في كل مشهد حدّث mins (دقائق الطريق من موقعهم الحالي) وdanger (من 0 آمن إلى 3 عالٍ) لكل مكان مسجّل. العتاد: لا تعطهم أغراضاً مجاناً؛ إذا عثروا على غرض حقيقي (سلاح، كشاف، حبل، بطارية، جهاز لاسلكي، مفتاح، خريطة، ملابس) فاذكره في items بحجم 1 إلى 3، واستعمل أغراضهم في السرد (الكشاف في الظلام، الحبل للتسلق)، وضع الغرض المكسور أو المستهلك في used. السمعة: إذا فعلوا ما يراه الناجون (قتل ناجين، التخلي عن حليف، إنقاذ ضعفاء، مشاركة المؤن) فضع rep:{d من -3 إلى 3,why:"وصف قصير"}، ودع الناجين يتصرفون حسب سمعتهم (هروب أو تحالف أو ثأر). الطقس: التزم بالطقس الواصل (حر يزيد العطش، مطر يغطي الأصوات، ضباب يخفي الأخطار، برد يزيد الإنهاك، عاصفة تعيق الحركة) وبدّل السرد وفقه. إذا وصلك «حدث ليلي إلزامي» فنفّذه بكل شدته. الحماس: يجب أن يكون كل مشهد مشحوناً بالتوتر والإثارة: جمل قصيرة وسريعة في الحركة، حواس حادة (أصوات، روائح، ظلام، أنفاس)، ساعة تدق (خطر يقترب أو وقت ينفد)، ومفاجأة أو انقلاب في كل مشهد تقريباً (وحش جديد، مطاردة، باب ينفتح، خيانة، صوت من العدم). في الاستيقاظ المفاجئ، الهجمات، المطاردات، والهروب واجعل الاختيارات قرارات لحظية بثمن حقيقي. بعد كل ذروة أعط لحظة هدوء قصيرة مشحونة بالقلق ثم صعّد من جديد. لا تجعل أي مشهد روتينياً أو بطيئاً.`;

async function stream(system,user,max,onText){
  const c=cfg(),g=c.prov==='gemini';
  const url=g?`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:streamGenerateContent?alt=sse`:'https://api.anthropic.com/v1/messages';
  const headers=g?{'content-type':'application/json','x-goog-api-key':c.key}:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  const body=g?{systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{maxOutputTokens:max+4000,temperature:1}}
             :{model:c.model,max_tokens:max,stream:true,system,messages:[{role:'user',content:user}]};
  const r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  if(!r.ok){let t='';try{const e=await r.json();t=e.error.message}catch(e){}
    throw new Error(r.status===429?'خلصت الحصة المجانية دلوقتي، جرّبوا بعد شوية أو بكرة. ':(r.status+' '+t))}
  const rd=r.body.getReader(),dc=new TextDecoder();let buf='',full='';
  for(;;){const{done,value}=await rd.read();if(done)break;
    buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
    for(const l of ls){if(!l.startsWith('data:'))continue;
      try{const j=JSON.parse(l.slice(5));let t='';
        if(g){t=((j.candidates||[])[0]?.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('')}
        else if(j.type==='content_block_delta'&&j.delta.text)t=j.delta.text;
        if(t){full+=t;onText(full)}}catch(e){}}}
  return full;
}

  (j.used||[]).forEach(n=>{const k=S.inv.findIndex(x=>x.name===n);if(k>=0){S.inv.splice(k,1);S.news.push('فُقد أو استُهلك: '+n)}});
  if(j.rep&&+j.rep.d){S.rep=Math.max(-10,Math.min(10,(S.rep||0)+Math.max(-3,Math.min(3,+j.rep.d))));S.deeds=(S.deeds||[]).concat(String(j.rep.why||'').slice(0,60)).slice(-4)}
  const kl=+j.kills||0;if(kl&&j.by!=null&&S.players[+j.by]){S.kb=S.kb||{};S.kb[+j.by]=(S.kb[+j.by]||0)+kl}}
function endStats(){const al=S.players.map((p,i)=>i);let best=[0,'-'];al.forEach(a=>al.forEach(b=>{if(a<b&&ptv(a,b)>best[0])best=[ptv(a,b),S.players[a].name+' و'+S.players[b].name]}));
  const kb=Object.entries(S.kb||{}).sort((a,b)=>b[1]-a[1])[0],aw=[...S.players].sort((a,b)=>(b.mxa||0)-(a.mxa||0))[0],R=[['clock','الأيام',Math.floor((S.t||0)/1440)+1],['sword','القتلى',S.kills],['sword','أكتر قاتل',kb?S.players[kb[0]].name+' ('+kb[1]+')':'-'],['moon','أطول سهر',aw&&aw.mxa?aw.name+' ('+Math.round(aw.mxa/60)+' ساعة)':'-'],['trust','أقوى ثقة',S.players.length>1?best[1]+' ('+best[0]+')':'-'],['broken','الخيانات',S.bet||0],['users','السمعة',repL(S.rep||0)]];
  return `<div class="sysc">${R.map(r=>`<div class="sk2"><span style="width:auto;flex:1">${ic(r[0])} ${r[1]}</span><b>${esc(String(r[2]))}</b></div>`).join('')}</div>`}
const ISYS='حوّل القصة التالية إلى عالم لعبة بقاء. أرجع JSON فقط بالشكل {"title":"","world":"وصف العالم والكارثة في جملتين","rules":"قواعد العالم والقوى وحدودها بدقة","start":"مكان البداية","goal":"هدف الرحلة","opening":"مقدمة قصيرة لما حدث قبل البداية","characters":[{"name":"","role":"رابط|حب|عدو|صديق|خائن|مجهول","note":""}]}';
try{JSON.parse(store.getItem('packs')||'[]').forEach(x=>PACKS.push(x))}catch(e){}
function importStory(){$('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>استيراد قصة</h2><p class="mut">الصق نص القصة أو ملخصها، والذكاء الاصطناعي يحوّلها لعالم لعب.</p><textarea id="stx" rows="8"></textarea><div id="sst" class="mut"></div><button class="pri" onclick="doImport()">حوّل لعالم لعب</button><button class="ch" onclick="closeM()">إلغاء</button></div></div>`}
async function doImport(){const t=($('stx').value||'').trim();if(t.length<40){$('sst').textContent='النص قصير';return}$('sst').textContent='جاري التحويل...';
  try{const full=await stream(ISYS,t.slice(0,12000),1500,()=>{}),p=JSON.parse(full.match(/\{[\s\S]*\}/)[0]);if(!p.title||!p.world)throw 0;p.characters=(p.characters||[]).slice(0,8);PACKS.push(p);store.setItem('packs',JSON.stringify(PACKS));closeM();setup()}catch(e){$('sst').textContent='فشل التحويل. جرّب نصاً أوضح أو تأكد من المفتاح.'}}
const rc=v=>v>60?'var(--grn)':v>30?'var(--hz)':'var(--red)';
const ring=(v,l,t,c)=>{v=Math.max(0,Math.min(100,Math.round(v)));const C=2*Math.PI*20;return `<div class="rg" style="text-align:center"><svg viewBox="0 0 50 50" width="60" height="60"><circle cx="25" cy="25" r="20" fill="none" stroke="#2a3a44" stroke-width="5"/><circle cx="25" cy="25" r="20" fill="none" stroke="${c||rc(v)}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(C*v/100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 25 25)"/><text x="25" y="29" text-anchor="middle" font-size="12" font-weight="700" fill="#eee">${t??v}</text></svg><div style="font-size:.75rem;color:#7fa9c9">${l}</div></div>`};
const needs=p=>{const a=[];if((p.hun??80)<40)a.push('جائع');if((p.thr??80)<40)a.push('عطشان');if((p.slp??90)<40)a.push('منهك من السهر');return a};
const mor=v=>v>=10?'ممتاز':v>=8?'جيد':v>=6?'متوسط':v>=4?'ضعيف':'ضعيف جداً';
const morC=v=>v>=8?'var(--grn)':v>=6?'#7fd6ff':v>=4?'var(--hz)':'var(--red)';
function needLine(){const n=[];if(S.res.food<1)n.push('أكل');if(S.res.water<1)n.push('مية');if(isNight())n.push('__night');const tired=S.players.some(p=>p.hp>0&&(p.slp??90)<40);const nt=n.includes('__night');const nn=n.filter(x=>x!=='__night');if(nt||tired)return `<div class="box err">${ic('moon')} ${nt?'حلّ الليل. دوّروا على مكان آمن تناموا فيه.':'الفريق منهك من قلة النوم.'}${nn.length?' ومفيش '+nn.join(' ولا ')+' معاكم.':''}</div>`;return nn.length?`<div class="box err">${ic('alert')} مفيش ${nn.join(' ولا ')} معاكم. لازم تدوّروا عليه (افتحوا الحقيبة لتشوفوا اللي معاكم).</div>`:''}
function statsHead(){const n=S.players.length,m=S.res.morale;let tr='';
  if(n>1)for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){if(S.players[a].hp<=0||S.players[b].hp<=0)continue;const v=ptv(a,b);tr+=`<div class="sk2"><span style="width:auto;flex:1">${esc(S.players[a].name)} ↔ ${esc(S.players[b].name)}</span><div class="sb"><i style="width:${v*10}%"></i></div><b>${v}</b></div>`}
  return `<div class="bagg"><div class="bg">${ring(m*10,'معنويات · '+mor(m),m,morC(m))}</div><div class="bg">${ic('sword')}<b>${S.kills}</b><small>قتلى</small></div><div class="bg">${ic('star')}<b>${S.level}</b><small>المستوى</small></div><div class="bg">${ic('shield')}<b>${S.res.def}/10</b><small>تحصين الملجأ</small></div><div class="bg">${ic('users')}<b>${S.rep||0}</b><small>سمعة · ${repL(S.rep||0)}</small></div></div>${(S.deeds||[]).length?`<div class="mut" style="margin:4px 0">آخر أفعالكم: ${(S.deeds||[]).map(esc).join(' · ')}</div>`:''}<div class="row" style="margin:6px 0"><button class="sysb" onclick="SND.tog()">${ic(SND.on?'vol':'volx')} الصوت</button><button class="sysb" onclick="togPF()">${ic('spark')} تحضير مسبق: ${store.getItem('pf')==='1'?'يعمل':'متوقف'}</button></div>${tr?`<div class="sysc"><div style="color:#7fa9c9">${ic('trust')} الثقة بين اللاعبين (0 إلى 10)</div>${tr}</div>`:''}`}
function upg(only){UPO=only==null?null:only;
  const tot=S.players.reduce((a,p)=>a+(p.hp>0?p.pts:0),0);
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div class="sysp" style="max-width:520px">
  <div class="sysh">${only==null?'[ الإحصائيات ]':'[ نافذة الحالة ]'}</div>${only==null?statsHead():''}<div class="sysl" style="text-align:center">النقاط المتاحة: <b style="color:#7fd6ff;font-size:1.2rem">${tot}</b></div>
  ${S.players.map((p,i)=>only!=null&&only!==i?'':`<div class="sysc"><div class="row" style="justify-content:space-between"><b>${esc(p.name)}</b><span style="color:#7fa9c9;font-size:.85rem">${p.role} · مستوى ${S.level} · نقاط ${p.pts}</span></div>
  <div class="row" style="justify-content:space-around;margin:6px 0">${ring(p.hp,'صحة')}${ring(p.hun??80,'شبع')}${ring(p.thr??80,'ارتواء')}${ring(p.slp??90,'نوم')}</div>${needs(p).length?`<div style="color:var(--red);font-size:.82rem">${needs(p).join(' · ')}: القدرات أضعف بمقدار ${pen(p)}</div>`:''}
  ${SK.map(k=>`<div class="sk2"><span>${k}</span><div class="sb"><i style="width:${Math.min(100,p.sk[k]*10)}%"></i></div><b>${p.sk[k]}</b><button class="sysb" ${p.pts&&p.hp>0?'':'disabled'} onclick="up(${i},'${k}')">+</button></div>`).join('')}
  ${fxHtml(p,false)}${p.power?'<div class="pro">✨ '+esc(p.power)+'</div>':''}
  <div style="color:#7fa9c9;margin-top:8px">القدرات</div>${ABIL[p.role].map((a,k)=>{const cd=(p.cdn&&p.cdn[a.n]>S.t)?p.cdn[a.n]-S.t:0,lock=S.level<a.lv;return `<div class="sk2"><span style="width:auto;flex:1">${a.n}<br><small style="color:#7fa9c9">${lock?'تُفتح عند المستوى '+a.lv:cd?'جاهزة بعد '+hrs(cd):a.t}</small></span><button class="sysb" ${lock||cd||p.hp<=0?'disabled':''} onclick="abil(${i},${k})">استخدم</button></div>`}).join('')}</div>`).join('')}</div></div>`;
}
const closeB=()=>{closeM();game()};
function bag(){
  S.open=S.open||[];const R=S.res,po=S.open.reduce((a,x)=>a+x.p,0);
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeB()"><div class="sysp" style="max-width:520px"><div class="sysh">[ الحقيبة ]</div>
  <div class="bagg">${['food','water','meds','fuel','ammo'].map(k=>`<div class="bg">${RES[k].split(' ')[0]}<b>${R[k]}</b><small>${RES[k].split(' ')[1]}</small></div>`).join('')}</div>
  ${invHtml()}<div class="sysl">${po?`حصص طعام مفتوحة: <b>${po}</b> · أقدمها تفسد بعد ${hrs(S.open[0].exp-S.t)}`:'لا توجد حصص مفتوحة'}</div>
  <button class="sysb" style="width:100%" ${R.food<1?'disabled':''} onclick="openCan()">افتح علبة طعام وقسّمها إلى 3 حصص</button>
  ${S.players.map((p,i)=>p.hp<=0?'':`<div class="sysc"><b>${esc(p.name)}</b>
  <div class="sk2"><span>جوع</span><div class="sb"><i style="width:${Math.round(p.hun??80)}%"></i></div><b>${Math.round(p.hun??80)}</b><button class="sysb" ${po?'':'disabled'} onclick="eat(${i})">كُل</button></div>
  <div class="sk2"><span>عطش</span><div class="sb"><i style="width:${Math.round(p.thr??80)}%"></i></div><b>${Math.round(p.thr??80)}</b><button class="sysb" ${R.water<1?'disabled':''} onclick="drink(${i})">اشرب</button></div></div>`).join('')}
  <div style="color:#7fa9c9;font-size:.82rem">الجوع والعطش ينقصان كل مشهد، وعند الصفر تفقد صحتك. الحصة المفتوحة تفسد بعد 8 ساعات.</div>
  <button class="sysb" style="width:100%;margin-top:8px" onclick="closeB()">إغلاق</button></div></div>`}
function openCan(){if(S.res.food<1)return;S.res.food--;S.open=(S.open||[]).concat([{p:3,exp:S.t+480}]);save();bag()}
function eat(i){if(!S.open||!S.open.length)return;S.open[0].p--;if(S.open[0].p<=0)S.open.shift();const p=S.players[i];p.hun=Math.min(100,(p.hun??80)+30);save();bag()}
function drink(i){if(S.res.water<1)return;S.res.water--;const p=S.players[i];p.thr=Math.min(100,(p.thr??80)+45);save();bag()}
function planBox(){return `<div class="box plan"><div style="color:#7fd6ff">${ic('spark')} خيارك الخاص</div><textarea id="plan" rows="2" placeholder="اكتبوا خطتكم... مثلاً: نشعل النار في المخزن لنجذب المصابين، أو: نرجع للبيت اللي حصّنّاه"></textarea><button class="sysb" style="width:100%;margin-top:6px" onclick="planGo()">جرّبوا الخطة</button></div>`}
function planGo(){const t=($('plan').value||'').trim();if(t.length<4)return;pickCustom('خطة كتبها اللاعبون بأنفسهم وعليك تجربتها بواقعية: '+t)}
function up(i,k){const p=S.players[i];if(p.pts>0){p.pts--;p.sk[k]++;save();upg(UPO);if(S.players.every(x=>!x.pts)){closeM();game()}}}

function code(){
  const c=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>كود الحفظ</h2><p class="mut">الرحلة بتتحفظ تلقائي. انسخوا الكود ده لو عايزين تكملوا من جهاز تاني.</p><textarea id="cd" rows="5" dir="ltr" readonly>${c}</textarea><div class="row" style="margin-top:8px"><button class="pri" onclick="$('cd').select();navigator.clipboard&&navigator.clipboard.writeText($('cd').value);this.textContent='اتنسخ ✓'">نسخ</button><button onclick="closeM();home()">خروج للرئيسية</button></div></div></div>`;
}
function loadCode(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>تحميل رحلة</h2><textarea id="cd" rows="5" dir="ltr" placeholder="الصقوا الكود هنا"></textarea><div style="height:8px"></div><button class="pri" onclick="try{S=JSON.parse(decodeURIComponent(escape(atob($('cd').value.trim()))));save();closeM();game()}catch(e){this.textContent='الكود غلط'}">تحميل</button></div></div>`;
}
function finish(){
  $('modal').innerHTML=`<div class="modal" onclick="if(event.target==this)closeM()"><div><h2>إنهاء الرحلة؟</h2><p>الراوي هيحوّل اللي حصل لحد دلوقتي لرواية قصيرة تقدروا تشاركوها.</p><button class="pri" onclick="closeM();novel()">اكتب الرواية</button><button class="ch" onclick="closeM()">لسه، نكمل</button></div></div>`;
}

async function novel(){
  if(busy)return;busy=true;
  const dead=S.players.filter(p=>p.hp<=0).map(p=>p.name);
  const stats=`قتلى: ${S.kills}، مستوى: ${S.level}، مشاهد: ${S.n}، الحلفاء: ${S.allies.map(a=>a.name).join('، ')||'لا أحد'}، الموتى: ${dead.join('، ')||'لا أحد'}، النهاية: ${S.over||'الفريق قرر ينهي الرحلة هنا'}`;
  const u=`الكارثة: ${S.sc}\nمكان البداية: ${S.place}\nالمقدمة: ${S.prologue||''}\nهدف الرحلة: ${S.goal||''}\nالأبطال: ${S.players.map(p=>`${p.name} (${p.role}، ${p.trait}، هدف سري: ${p.goal}${p.power?'، قوة: '+p.power:''})`).join(' / ')}\nالأحداث بالترتيب: ${S.beats.map((b,i)=>`${i+1}) ${b}${S.log[i]?' ← اختاروا: '+S.log[i].c:''}`).join('\n')}\nعواقب: ${S.seeds.join(' | ')}\nآخر مشهد: ${S.scene?S.scene.text:''}\nإحصائيات: ${stats}`;
  const sys='إنت روائي. حوّل أحداث رحلة النجاة دي لرواية قصيرة بلغة عربية فصحى أدبية جميلة وسليمة، حوالي 900 إلى 1300 كلمة، مقسمة لـ 3 إلى 5 فصول بعناوين، وليها عنوان رئيسي. استخدم أسماء الأبطال وقراراتهم الحقيقية وعواقبها، واكتب حوارات ووصف، وخلّي النهاية متسقة مع إحصائيات الرحلة. متضيفش أحداث كبيرة من عندك. اكتب النص بس.';
  $('app').innerHTML=`<h2>الرواية</h2><div class="tape"></div><div class="novel" id="nv"><span class="mut">الراوي بيكتب رحلتكم...</span></div>`;
  try{
    const t=await stream(sys,u,3000,t=>$('nv').textContent=t);
    busy=false;S.novel=t;save();
    $('app').innerHTML=`<div class="novel">${esc(t)}</div><div class="tape" style="margin-top:20px"></div>
    <div class="box mut">${esc(stats)}</div>
    <button class="pri" onclick="shareN()">مشاركة الرواية</button>
    <button class="ch" onclick="home()">الرئيسية</button>`;
  }catch(e){busy=false;$('app').innerHTML=`<div class="box err">حصل خطأ: ${esc(e.message)}</div><button class="pri" onclick="novel()">حاول تاني</button><button class="ch" onclick="game()">رجوع</button>`}
}
function shareN(){
  const t=S.novel;
  if(navigator.share)navigator.share({title:'رحلتنا في آخر الدنيا',text:t}).catch(()=>{});
  else navigator.clipboard.writeText(t).then(()=>alert('اتنسخت الرواية'));
}
home();
if(!cfg().key)setTimeout(settings,300);
</script>
</body>
